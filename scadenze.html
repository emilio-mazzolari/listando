<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Listando - Scadenze</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icon-pwa-512.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Listando">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            color-scheme: light;
            --accent: #0ea5e9;
            --accent-bg: rgba(14,165,233,0.08);
            --green: #0fba8d; --red: #ff3b30; --orange: #ff9500;
            --grey: #d8dddc; --grey-light: #f2f2f7;
            --dark: #111; --bg: #f5f6f8; --white: #fff;
        }
        * { box-sizing: border-box; }
        html, body { overflow-x: hidden; max-width: 100%; margin: 0; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--dark); }

        .page-header { position: sticky; top: 0; z-index: 100; background: var(--white); border-bottom: 2px solid var(--grey-light); padding: 14px 16px; padding-top: max(14px, env(safe-area-inset-top, 14px)); }
        .header-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .btn-back { width: 40px; height: 40px; border-radius: 12px; border: 2.5px solid var(--grey); background: var(--white); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
        .btn-back svg { width: 18px; height: 18px; stroke: var(--dark); fill: none; stroke-width: 2.5; }
        .header-title { font-weight: 900; font-size: 18px; flex: 1; }
        .btn-add-hdr { width: 40px; height: 40px; border-radius: 12px; border: none; background: var(--accent); color: white; font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        .tabs-row { display: flex; gap: 8px; }
        .tab-pill { flex: 1; padding: 10px 8px; border-radius: 14px; border: 2.5px solid var(--grey); background: var(--white); font-weight: 800; font-size: 13px; cursor: pointer; text-align: center; transition: all 0.15s; color: #999; }
        .tab-pill.active { border-color: var(--accent); color: var(--accent); background: var(--accent-bg); }

        .cat-scroll { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 10px 16px 0; }
        .cat-scroll::-webkit-scrollbar { display: none; }
        .cat-chip { flex-shrink: 0; padding: 6px 14px; border-radius: 20px; border: 2px solid var(--grey); background: white; font-weight: 800; font-size: 12px; cursor: pointer; color: #888; transition: all 0.15s; }
        .cat-chip.active { border-color: var(--accent); background: var(--accent-bg); color: var(--accent); }

        .list-body { padding: 10px 16px 110px; }
        .section-label { font-size: 11px; font-weight: 800; color: #aaa; text-transform: uppercase; letter-spacing: 0.8px; margin: 16px 0 6px; }
        .empty-msg { text-align: center; padding: 64px 24px; color: #bbb; font-weight: 700; font-size: 15px; }

        .card { background: var(--white); border-radius: 18px; margin-bottom: 8px; padding: 14px 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); display: flex; align-items: center; gap: 12px; cursor: pointer; }
        .semaforo { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
        .semaforo.verde { background: var(--green); }
        .semaforo.arancione { background: var(--orange); }
        .semaforo.rosso { background: var(--red); }
        .semaforo.grigio { background: #ccc; }

        .card-icon { font-size: 26px; width: 42px; text-align: center; flex-shrink: 0; }
        .card-body { flex: 1; min-width: 0; }
        .card-title { font-weight: 900; font-size: 15px; }
        .card-meta { display: flex; gap: 6px; margin-top: 5px; flex-wrap: wrap; align-items: center; }
        .badge { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 8px; }
        .badge-cat { background: var(--accent-bg); color: var(--accent); }
        .badge-verde { background: rgba(15,186,141,0.12); color: var(--green); }
        .badge-arancione { background: rgba(255,149,0,0.12); color: var(--orange); }
        .badge-rosso { background: rgba(255,59,48,0.12); color: var(--red); }
        .badge-grey { background: var(--grey-light); color: #888; }
        .card-note { font-size: 13px; color: #888; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .btn-check { flex-shrink: 0; width: 32px; height: 32px; border-radius: 10px; border: 2.5px solid var(--grey); background: white; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; transition: all 0.15s; }
        .btn-check.done { border-color: var(--green); background: rgba(15,186,141,0.08); color: var(--green); }

        .modal-overlay { display: none; position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,0.5); align-items: flex-end; justify-content: center; }
        .modal-overlay.open { display: flex; }
        .modal-box { background: var(--white); border-radius: 28px 28px 0 0; padding: 24px 20px; padding-bottom: max(24px, env(safe-area-inset-bottom, 24px)); width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; }
        .modal-handle { width: 40px; height: 4px; background: var(--grey); border-radius: 4px; margin: 0 auto 20px; }
        .modal-title { font-weight: 900; font-size: 18px; margin-bottom: 18px; }
        .form-group { margin-bottom: 12px; }
        .form-label { font-size: 12px; font-weight: 800; color: #666; margin-bottom: 5px; display: block; text-transform: uppercase; letter-spacing: 0.4px; }
        .form-input { width: 100%; padding: 12px 14px; border-radius: 14px; border: 2.5px solid var(--grey); font-size: 15px; font-family: inherit; outline: none; transition: border-color 0.2s; }
        .form-input:focus { border-color: var(--accent); }
        .form-row { display: flex; gap: 8px; }
        .form-row .form-group { flex: 1; }

        .btn-save-modal { width: 100%; padding: 16px; border-radius: 18px; border: none; background: var(--accent); color: white; font-weight: 900; font-size: 16px; cursor: pointer; font-family: inherit; margin-top: 8px; }
        .btn-delete-modal { width: 100%; padding: 14px; border-radius: 18px; border: none; background: #fff0f0; color: var(--red); font-weight: 800; font-size: 14px; cursor: pointer; font-family: inherit; margin-top: 8px; }

        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 70px; background: white; display: flex; justify-content: space-around; align-items: center; border-top: 2px solid var(--grey-light); padding-bottom: env(safe-area-inset-bottom); z-index: 100; }
        .tab-item { flex: 1; text-align: center; font-size: 11px; color: var(--dark); text-decoration: none; font-weight: 800; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .icon-tab { width: 24px; height: 24px; stroke-width: 2.5px; stroke: var(--dark); fill: none; }
        .toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--dark); color: white; padding: 12px 20px; border-radius: 14px; font-weight: 700; font-size: 14px; opacity: 0; transition: all 0.25s; white-space: nowrap; z-index: 999; pointer-events: none; }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    
        /* ── Feedback fab ── */
        .fab-feedback { position: fixed; bottom: 88px; right: 18px; width: 46px; height: 46px; border-radius: 50%; background: #fff; border: 2.5px solid #e0e0e0; box-shadow: 0 2px 10px rgba(0,0,0,.12); display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 200; }
        .fab-feedback svg { width: 20px; height: 20px; stroke: #777; fill: none; stroke-width: 2; }
        .fb-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 999; display: none; align-items: flex-end; justify-content: center; padding-bottom: env(safe-area-inset-bottom,0); }
        .fb-overlay.open { display: flex; }
        .fb-sheet { background: #fff; border-radius: 24px 24px 0 0; padding: 24px 20px 40px; width: 100%; max-width: 520px; }
        .fb-sheet h3 { margin: 0 0 16px; font-size: 17px; font-weight: 800; }
        .fb-tipo { display: flex; gap: 10px; margin-bottom: 14px; }
        .fb-tipo input[type=radio] { display: none; }
        .fb-tipo label { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 10px; border-radius: 12px; border: 2px solid #e0e0e0; font-size: 14px; font-weight: 600; cursor: pointer; transition: all .15s; }
        .fb-tipo input[type=radio]:checked + label { border-color: var(--accent,#5856d6); background: color-mix(in srgb,var(--accent,#5856d6) 12%,#fff); color: var(--accent,#5856d6); }
        .fb-textarea { width: 100%; padding: 12px 14px; border-radius: 14px; border: 2.5px solid #e0e0e0; font-size: 15px; font-family: inherit; resize: none; outline: none; box-sizing: border-box; }
        .fb-textarea:focus { border-color: var(--accent,#5856d6); }
        .fb-send { width: 100%; margin-top: 14px; padding: 14px; border-radius: 14px; background: var(--accent,#5856d6); color: #fff; font-size: 16px; font-weight: 700; border: none; cursor: pointer; }
    </style>
</head>
<body>

<div class="page-header">
    <div class="header-row">
        <button class="btn-back" onclick="history.back()">
            <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <div class="header-title">⏰ SCADENZE</div>
        <button class="btn-add-hdr" onclick="apriModale()">+</button>
    </div>
    <div class="tabs-row">
        <button class="tab-pill active" id="tabAttive" onclick="setTab('attive')">⏰ In corso</button>
        <button class="tab-pill" id="tabGestite" onclick="setTab('gestite')">✅ Gestite</button>
    </div>
</div>

<div class="cat-scroll" id="catScroll"></div>
<div class="list-body" id="listBody"></div>

<!-- Modal -->
<div class="modal-overlay" id="modale">
    <div class="modal-box">
        <div class="modal-handle"></div>
        <div class="modal-title" id="modalTitle">Nuova scadenza</div>

        <div class="form-group">
            <label class="form-label">Titolo *</label>
            <input class="form-input" id="fTitolo" placeholder="es. Patente, Bollo auto, Passaporto…" type="text">
        </div>

        <div class="form-row">
            <div class="form-group">
                <label class="form-label">Categoria</label>
                <select class="form-input" id="fCategoria">
                    <option value="Documenti">📄 Documenti</option>
                    <option value="Auto">🚗 Auto</option>
                    <option value="Casa">🏠 Casa</option>
                    <option value="Lavoro">💼 Lavoro</option>
                    <option value="Salute">🏥 Salute</option>
                    <option value="Tasse">💶 Tasse</option>
                    <option value="Altro" selected>⏰ Altro</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Data scadenza *</label>
                <input class="form-input" id="fData" type="date">
            </div>
        </div>

        <div class="form-group">
            <label class="form-label">Note</label>
            <input class="form-input" id="fNote" placeholder="Dettagli aggiuntivi…" type="text">
        </div>

        <button class="btn-save-modal" onclick="salva()">SALVA</button>
        <button class="btn-delete-modal" id="btnElimina" style="display:none" onclick="elimina()">ELIMINA</button>
    </div>
</div>

<div class="tab-bar">
    <a href="index.html" class="tab-item">
        <svg class="icon-tab" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 15 22"/></svg>
        HOME
    </a>
</div>
<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = "https://eejdpophfxsrqdvsucye.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVlamRwb3BoZnhzcnFkdnN1Y3llIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc2NTMzMDQsImV4cCI6MjA5MzIyOTMwNH0.mpxbwlJyIdZgqKIdutHbLd85JR1P11yiglbYeApi17k";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const userEmail = localStorage.getItem('userEmail');
if (!userEmail) location.href = 'login.html';

const CAT_EMOJI = { Documenti:'📄', Auto:'🚗', Casa:'🏠', Lavoro:'💼', Salute:'🏥', Tasse:'💶', Altro:'⏰' };

let items = [];
let tabCorrente = 'attive';
let catFiltro = 'Tutti';
let editId = null;

async function carica() {
    const { data, error } = await sb.from('scadenze').select('*')
        .eq('email_utente', userEmail).order('data_scadenza', { ascending: true });
    if (error) { toast('Errore: ' + error.message); return; }
    items = data || [];
    renderCats();
    render();
}

function diffGiorni(data) {
    return Math.ceil((new Date(data) - new Date()) / 86400000);
}

function statoItem(item) {
    if (item.gestita) return 'gestita';
    const diff = diffGiorni(item.data_scadenza);
    if (diff < 0) return 'scaduta';
    if (diff <= 30) return 'presto';
    return 'ok';
}

function renderCats() {
    const cats = ['Tutti', ...new Set(items.filter(i => !i.gestita).map(i => i.categoria).filter(Boolean))];
    document.getElementById('catScroll').innerHTML = cats.map(c =>
        `<button class="cat-chip${catFiltro === c ? ' active' : ''}" onclick="setCat('${c.replace(/'/g,"\\'")}')">
            ${CAT_EMOJI[c] || ''} ${c}
         </button>`
    ).join('');
}
function setCat(c) { catFiltro = c; renderCats(); render(); }
function setTab(t) {
    tabCorrente = t;
    document.getElementById('tabAttive').className = 'tab-pill' + (t === 'attive' ? ' active' : '');
    document.getElementById('tabGestite').className = 'tab-pill' + (t === 'gestite' ? ' active' : '');
    render();
}

function render() {
    const isGestite = tabCorrente === 'gestite';
    let filtered = items.filter(i => !!i.gestita === isGestite);
    if (!isGestite && catFiltro !== 'Tutti') filtered = filtered.filter(i => i.categoria === catFiltro);

    const body = document.getElementById('listBody');
    if (!filtered.length) {
        body.innerHTML = `<div class="empty-msg">${isGestite ? '✅ Nessuna scadenza gestita' : '⏰ Nessuna scadenza'}</div>`;
        return;
    }

    // Raggruppa per stato
    const gruppi = isGestite
        ? { 'Gestite': filtered }
        : {
            'Scadute': filtered.filter(i => statoItem(i) === 'scaduta'),
            'Entro 30 giorni': filtered.filter(i => statoItem(i) === 'presto'),
            'Future': filtered.filter(i => statoItem(i) === 'ok'),
          };

    body.innerHTML = Object.entries(gruppi).filter(([,arr]) => arr.length > 0).map(([label, arr]) =>
        `<div class="section-label">${label}</div>` +
        arr.map(i => {
            const stato = statoItem(i);
            const diff = diffGiorni(i.data_scadenza);
            const semaforoClass = stato === 'scaduta' ? 'rosso' : stato === 'presto' ? 'arancione' : stato === 'gestita' ? 'grigio' : 'verde';
            const badgeClass = stato === 'scaduta' ? 'badge-rosso' : stato === 'presto' ? 'badge-arancione' : stato === 'gestita' ? 'badge-grey' : 'badge-verde';
            const dataFmt = new Date(i.data_scadenza + 'T00:00:00').toLocaleDateString('it-IT', { day:'numeric', month:'short', year:'numeric' });
            const diffLabel = i.gestita ? 'gestita' : diff < 0 ? `scaduta ${Math.abs(diff)}gg fa` : diff === 0 ? 'scade oggi' : `tra ${diff} giorni`;
            return `<div class="card" onclick="apriModifica(${i.id})">
                <div class="semaforo ${semaforoClass}"></div>
                <div class="card-icon">${CAT_EMOJI[i.categoria] || '⏰'}</div>
                <div class="card-body">
                    <div class="card-title">${i.titolo}</div>
                    ${i.note ? `<div class="card-note">${i.note}</div>` : ''}
                    <div class="card-meta">
                        <span class="badge badge-cat">${i.categoria || 'Altro'}</span>
                        <span class="badge ${badgeClass}">${dataFmt} · ${diffLabel}</span>
                    </div>
                </div>
                <button class="btn-check${i.gestita ? ' done' : ''}"
                    onclick="event.stopPropagation(); toggleGestita(${i.id})">
                    ${i.gestita ? '✓' : ''}
                </button>
            </div>`;
        }).join('')
    ).join('');
}

async function toggleGestita(id) {
    const item = items.find(x => x.id === id);
    if (!item) return;
    const nuovoVal = !item.gestita;
    const { error } = await sb.from('scadenze').update({ gestita: nuovoVal }).eq('id', id);
    if (error) { toast('Errore: ' + error.message); return; }
    item.gestita = nuovoVal;
    render();
    toast(nuovoVal ? '✅ Segnata come gestita' : 'Rimessa in corso');
}

function apriModale() {
    editId = null;
    document.getElementById('modalTitle').textContent = 'Nuova scadenza';
    document.getElementById('fTitolo').value = '';
    document.getElementById('fCategoria').value = 'Altro';
    document.getElementById('fData').value = '';
    document.getElementById('fNote').value = '';
    document.getElementById('btnElimina').style.display = 'none';
    document.getElementById('modale').classList.add('open');
}

function apriModifica(id) {
    const i = items.find(x => x.id === id);
    if (!i) return;
    editId = id;
    document.getElementById('modalTitle').textContent = 'Modifica scadenza';
    document.getElementById('fTitolo').value = i.titolo || '';
    document.getElementById('fCategoria').value = i.categoria || 'Altro';
    document.getElementById('fData').value = i.data_scadenza || '';
    document.getElementById('fNote').value = i.note || '';
    document.getElementById('btnElimina').style.display = '';
    document.getElementById('modale').classList.add('open');
}

async function salva() {
    const titolo = document.getElementById('fTitolo').value.trim();
    const data = document.getElementById('fData').value;
    if (!titolo) { toast('Inserisci il titolo'); return; }
    if (!data) { toast('Inserisci la data di scadenza'); return; }
    const row = {
        email_utente: userEmail,
        titolo,
        categoria: document.getElementById('fCategoria').value,
        data_scadenza: data,
        note: document.getElementById('fNote').value.trim() || null,
        gestita: false,
    };
    let err;
    if (editId) {
        ({ error: err } = await sb.from('scadenze').update(row).eq('id', editId));
        if (err) { toast('Errore: ' + err.message); return; }
        toast('✓ Aggiornato');
    } else {
        ({ error: err } = await sb.from('scadenze').insert(row));
        if (err) { toast('Errore: ' + err.message); return; }
        toast('✓ Aggiunto');
    }
    document.getElementById('modale').classList.remove('open');
    await carica();
}

async function elimina() {
    if (!editId || !confirm('Eliminare questa scadenza?')) return;
    await sb.from('scadenze').delete().eq('id', editId);
    document.getElementById('modale').classList.remove('open');
    toast('Eliminato');
    await carica();
}

document.getElementById('modale').addEventListener('click', e => {
    if (e.target === document.getElementById('modale')) document.getElementById('modale').classList.remove('open');
});

let toastTimer;
function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}

carica();

    function _fbApri() { document.getElementById('fbOverlay').classList.add('open'); document.getElementById('fbTesto').focus(); }
    function _fbChiudi() { document.getElementById('fbOverlay').classList.remove('open'); document.getElementById('fbTesto').value = ''; }
    async function _fbInvia() {
        const testo = document.getElementById('fbTesto').value.trim();
        if (!testo) return;
        const tipo = document.querySelector('input[name="fbTipo"]:checked').value;
        const email = (typeof userEmail !== 'undefined' && userEmail) ? userEmail : (localStorage.getItem('userEmail') || 'anonimo');
        const btn = document.getElementById('fbSendBtn');
        btn.disabled = true; btn.textContent = 'Invio…';
        try {
            const r = await fetch('/api/feedback', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ email, tipo, testo }) });
            if (r.ok) {
                _fbChiudi();
                if (typeof toast === 'function') toast('Feedback inviato, grazie! 🙏');
            }
        } catch(e) {}
        finally { btn.disabled = false; btn.textContent = 'Invia'; }
    }
</script>

<!-- feedback -->
<button class="fab-feedback" onclick="_fbApri()" title="Invia feedback">
    <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
</button>
<div class="fb-overlay" id="fbOverlay" onclick="if(event.target===this)_fbChiudi()">
    <div class="fb-sheet">
        <h3>💬 Dai il tuo feedback</h3>
        <div class="fb-tipo">
            <input type="radio" name="fbTipo" id="fbSug" value="suggerimento" checked>
            <label for="fbSug">💡 Suggerimento</label>
            <input type="radio" name="fbTipo" id="fbErr" value="errore">
            <label for="fbErr">🐛 Segnala errore</label>
        </div>
        <textarea class="fb-textarea" id="fbTesto" rows="4" placeholder="Descrivi il problema o il suggerimento…"></textarea>
        <button class="fb-send" id="fbSendBtn" onclick="_fbInvia()">Invia</button>
    </div>
</div>
</body>
</html>

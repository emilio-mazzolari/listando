<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Listando - Documenti</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icon-pwa-512.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Listando">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            color-scheme: light;
            --accent: #4f46e5;
            --accent-bg: rgba(79,70,229,0.08);
            --green: #16a34a; --red: #ff3b30; --orange: #f97316;
            --grey: #d8dddc; --grey-light: #f2f2f7;
            --dark: #111; --bg: #f5f6f8; --white: #fff;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { overflow-x: hidden; max-width: 100%; margin: 0; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--dark); padding-bottom: 90px; }

        .page-header { position: sticky; top: 0; z-index: 100; background: var(--white); border-bottom: 2px solid var(--grey-light); padding: 14px 16px; padding-top: max(14px, env(safe-area-inset-top, 14px)); }
        .header-row { display: flex; align-items: center; gap: 10px; }
        .btn-back { width: 40px; height: 40px; border-radius: 12px; border: 2.5px solid var(--grey); background: var(--white); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
        .btn-back svg { width: 18px; height: 18px; stroke: var(--dark); fill: none; stroke-width: 2.5; }
        .header-title { font-weight: 900; font-size: 18px; flex: 1; }
        .btn-add-hdr { width: 40px; height: 40px; border-radius: 12px; border: none; background: var(--accent); color: white; font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        .search-wrap { padding: 10px 16px 0; }
        .search-bar { width: 100%; padding: 10px 14px; border-radius: 14px; border: 2px solid var(--grey); font-size: 15px; font-family: inherit; outline: none; background: var(--white); }
        .search-bar:focus { border-color: var(--accent); }

        .chips-scroll { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 10px 16px 4px; }
        .chips-scroll::-webkit-scrollbar { display: none; }
        .chip { flex-shrink: 0; padding: 6px 14px; border-radius: 20px; border: 2px solid var(--grey); background: white; font-weight: 800; font-size: 12px; cursor: pointer; color: #888; transition: all 0.15s; }
        .chip.active { border-color: var(--accent); background: var(--accent-bg); color: var(--accent); }

        .list-body { padding: 8px 16px 110px; }
        .section-label { font-size: 11px; font-weight: 800; color: #aaa; text-transform: uppercase; letter-spacing: 0.8px; margin: 14px 0 6px; }
        .empty-msg { text-align: center; padding: 64px 24px; color: #bbb; font-weight: 700; font-size: 15px; line-height: 1.6; }

        .doc-card { background: var(--white); border-radius: 18px; margin-bottom: 8px; padding: 14px 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); display: flex; align-items: center; gap: 13px; cursor: pointer; active-scale: .97; transition: transform .1s; }
        .doc-card:active { transform: scale(0.97); }
        .doc-emoji { font-size: 30px; width: 44px; text-align: center; flex-shrink: 0; }
        .doc-body { flex: 1; min-width: 0; }
        .doc-nome { font-weight: 900; font-size: 15px; }
        .doc-intestatario { font-size: 12px; color: #888; font-weight: 600; margin-top: 1px; }
        .doc-meta { display: flex; gap: 5px; margin-top: 6px; flex-wrap: wrap; align-items: center; }
        .badge { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 8px; }
        .badge-tipo { background: var(--accent-bg); color: var(--accent); }
        .badge-verde { background: rgba(22,163,74,0.1); color: var(--green); }
        .badge-arancione { background: rgba(249,115,22,0.12); color: var(--orange); }
        .badge-rosso { background: rgba(255,59,48,0.12); color: var(--red); }
        .badge-grey { background: var(--grey-light); color: #888; }
        .doc-numero { font-size: 12px; color: #aaa; margin-top: 3px; font-family: monospace; letter-spacing: 0.5px; }

        .semaforo { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; align-self: flex-start; margin-top: 4px; }
        .semaforo.verde { background: var(--green); }
        .semaforo.arancione { background: var(--orange); }
        .semaforo.rosso { background: var(--red); }
        .semaforo.grigio { background: #ccc; }

        /* Modal */
        .modal-overlay { display: none; position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,0.5); align-items: flex-end; justify-content: center; }
        .modal-overlay.open { display: flex; }
        .modal-box { background: var(--white); border-radius: 28px 28px 0 0; padding: 24px 20px; padding-bottom: max(24px, env(safe-area-inset-bottom, 24px)); width: 100%; max-width: 500px; max-height: 92vh; overflow-y: auto; }
        .modal-handle { width: 40px; height: 4px; background: var(--grey); border-radius: 4px; margin: 0 auto 20px; }
        .modal-title { font-weight: 900; font-size: 18px; margin-bottom: 18px; }
        .form-group { margin-bottom: 12px; }
        .form-label { font-size: 12px; font-weight: 800; color: #666; margin-bottom: 5px; display: block; text-transform: uppercase; letter-spacing: 0.4px; }
        .form-input { width: 100%; padding: 12px 14px; border-radius: 14px; border: 2.5px solid var(--grey); font-size: 15px; font-family: inherit; outline: none; transition: border-color 0.2s; background: white; }
        .form-input:focus { border-color: var(--accent); }
        .form-row { display: flex; gap: 8px; }
        .form-row .form-group { flex: 1; }
        .tipo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-bottom: 12px; }
        .tipo-btn { padding: 10px 8px; border-radius: 13px; border: 2.5px solid var(--grey); background: white; font-size: 13px; font-weight: 700; cursor: pointer; text-align: center; transition: all 0.15s; font-family: inherit; color: #555; }
        .tipo-btn.sel { border-color: var(--accent); background: var(--accent-bg); color: var(--accent); }
        .btn-save-modal { width: 100%; padding: 16px; border-radius: 18px; border: none; background: var(--accent); color: white; font-weight: 900; font-size: 16px; cursor: pointer; font-family: inherit; margin-top: 8px; }
        .btn-delete-modal { width: 100%; padding: 14px; border-radius: 18px; border: none; background: #fff0f0; color: var(--red); font-weight: 800; font-size: 14px; cursor: pointer; font-family: inherit; margin-top: 8px; }

        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 70px; background: white; display: flex; justify-content: space-around; align-items: center; border-top: 2px solid var(--grey-light); padding-bottom: env(safe-area-inset-bottom); z-index: 100; }
        .tab-item { flex: 1; text-align: center; font-size: 11px; color: var(--dark); text-decoration: none; font-weight: 800; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .icon-tab { width: 24px; height: 24px; stroke-width: 2.5px; stroke: var(--dark); fill: none; }
        .toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--dark); color: white; padding: 12px 20px; border-radius: 14px; font-weight: 700; font-size: 14px; opacity: 0; transition: all 0.25s; white-space: nowrap; z-index: 999; pointer-events: none; }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        .fab-feedback { position: fixed; bottom: 88px; right: 18px; width: 46px; height: 46px; border-radius: 50%; background: #fff; border: 2.5px solid #e0e0e0; box-shadow: 0 2px 10px rgba(0,0,0,.12); display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 200; }
        .fab-feedback svg { width: 20px; height: 20px; stroke: #777; fill: none; stroke-width: 2; }
        .fb-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 999; display: none; align-items: flex-end; justify-content: center; padding-bottom: env(safe-area-inset-bottom,0); }
        .fb-overlay.open { display: flex; }
        .fb-sheet { background: #fff; border-radius: 24px 24px 0 0; padding: 24px 20px 40px; width: 100%; max-width: 520px; }
        .fb-sheet h3 { margin: 0 0 16px; font-size: 17px; font-weight: 800; }
        .fb-tipo { display: flex; gap: 10px; margin-bottom: 14px; }
        .fb-tipo input[type=radio] { display: none; }
        .fb-tipo label { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 10px; border-radius: 12px; border: 2px solid #e0e0e0; font-size: 14px; font-weight: 600; cursor: pointer; transition: all .15s; }
        .fb-tipo input[type=radio]:checked + label { border-color: var(--accent); background: color-mix(in srgb,var(--accent) 12%,#fff); color: var(--accent); }
        .fb-textarea { width: 100%; padding: 12px 14px; border-radius: 14px; border: 2.5px solid #e0e0e0; font-size: 15px; font-family: inherit; resize: none; outline: none; box-sizing: border-box; }
        .fb-textarea:focus { border-color: var(--accent); }
        .fb-send { width: 100%; margin-top: 14px; padding: 14px; border-radius: 14px; background: var(--accent); color: #fff; font-size: 16px; font-weight: 700; border: none; cursor: pointer; }
    </style>
</head>
<body>

<div class="page-header">
    <div class="header-row">
        <button class="btn-back" onclick="history.back()">
            <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <div class="header-title">DOCUMENTI</div>
        <button class="btn-add-hdr" onclick="apriNuovo()">+</button>
    </div>
</div>

<div class="search-wrap">
    <input class="search-bar" id="searchInput" type="search" placeholder="Cerca documento…" oninput="render()">
</div>
<div class="chips-scroll" id="chipsScroll"></div>
<div class="list-body" id="listBody"></div>

<!-- Modal -->
<div class="modal-overlay" id="modale">
    <div class="modal-box">
        <div class="modal-handle"></div>
        <div class="modal-title" id="modalTitle">Nuovo documento</div>

        <div class="form-group">
            <label class="form-label">Nome / Etichetta *</label>
            <input class="form-input" id="fNome" placeholder="es. Carta d'identità mia, Passaporto Marco…" type="text">
        </div>

        <div class="form-group">
            <label class="form-label">Tipo documento</label>
            <div class="tipo-grid" id="tipoGrid"></div>
        </div>

        <div class="form-group">
            <label class="form-label">Intestatario</label>
            <input class="form-input" id="fIntestatario" placeholder="es. Io, Moglie, Figlio, Marco…" type="text">
        </div>

        <div class="form-group">
            <label class="form-label">Numero documento</label>
            <input class="form-input" id="fNumero" placeholder="es. AX1234567" type="text" autocomplete="off">
        </div>

        <div class="form-group">
            <label class="form-label">Ente di rilascio</label>
            <input class="form-input" id="fEnte" placeholder="es. Comune di Milano, Motorizzazione…" type="text">
        </div>

        <div class="form-row">
            <div class="form-group">
                <label class="form-label">Data rilascio</label>
                <input class="form-input" id="fRilascio" type="date">
            </div>
            <div class="form-group">
                <label class="form-label">Data scadenza</label>
                <input class="form-input" id="fScadenza" type="date">
            </div>
        </div>

        <div class="form-group">
            <label class="form-label">Note</label>
            <input class="form-input" id="fNote" placeholder="Dettagli aggiuntivi…" type="text">
        </div>

        <button class="btn-save-modal" onclick="salva()">SALVA</button>
        <button class="btn-delete-modal" id="btnElimina" style="display:none" onclick="elimina()">ELIMINA</button>
    </div>
</div>

<div class="tab-bar">
    <a href="index.html" class="tab-item">
        <svg class="icon-tab" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 15 22"/></svg>
        HOME
    </a>
</div>
<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = "https://eejdpophfxsrqdvsucye.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVlamRwb3BoZnhzcnFkdnN1Y3llIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc2NTMzMDQsImV4cCI6MjA5MzIyOTMwNH0.mpxbwlJyIdZgqKIdutHbLd85JR1P11yiglbYeApi17k";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const userEmail = localStorage.getItem('userEmail');
if (!userEmail) { localStorage.setItem('pendingUrl', location.pathname); location.href = 'login.html'; }

const TIPI = [
    { key: 'carta_identita',    label: "Carta d'identità", emoji: '🪪' },
    { key: 'passaporto',        label: 'Passaporto',        emoji: '🛂' },
    { key: 'patente',           label: 'Patente',           emoji: '🚗' },
    { key: 'tessera_sanitaria', label: 'Tessera sanitaria', emoji: '🏥' },
    { key: 'codice_fiscale',    label: 'Codice fiscale',    emoji: '📋' },
    { key: 'cert_nascita',      label: 'Cert. nascita',     emoji: '📜' },
    { key: 'cert_matrimonio',   label: 'Atto matrimonio',   emoji: '💍' },
    { key: 'diploma',           label: 'Diploma / Laurea',  emoji: '🎓' },
    { key: 'rogito',            label: 'Rogito / Proprietà',emoji: '🏠' },
    { key: 'libretto_auto',     label: 'Libretto auto',     emoji: '🚙' },
    { key: 'contratto_lavoro',  label: 'Contratto lavoro',  emoji: '💼' },
    { key: 'altro',             label: 'Altro',             emoji: '📄' },
];
const TIPI_MAP = Object.fromEntries(TIPI.map(t => [t.key, t]));

let items = [];
let filtroIntestatario = 'Tutti';
let editId = null;
let tipoSel = 'carta_identita';

// ── Tipo grid ─────────────────────────────────────────────
function buildTipoGrid() {
    document.getElementById('tipoGrid').innerHTML = TIPI.map(t =>
        `<button class="tipo-btn${tipoSel === t.key ? ' sel' : ''}" onclick="selTipo('${t.key}')">
            ${t.emoji} ${t.label}
        </button>`
    ).join('');
}
function selTipo(key) { tipoSel = key; buildTipoGrid(); }

// ── Data load ─────────────────────────────────────────────
async function carica() {
    const { data, error } = await sb.from('documenti')
        .select('*').eq('email_utente', userEmail)
        .order('created_at', { ascending: true });
    if (error) { toast('Errore caricamento: ' + error.message); return; }
    items = data || [];
    renderChips();
    render();
}

// ── Chips intestatari ─────────────────────────────────────
function renderChips() {
    const intestatari = ['Tutti', ...new Set(items.map(i => i.intestatario).filter(Boolean))];
    document.getElementById('chipsScroll').innerHTML = intestatari.map(s =>
        `<button class="chip${filtroIntestatario === s ? ' active' : ''}" onclick="setChip('${esc(s)}')">${s}</button>`
    ).join('');
}
function setChip(v) { filtroIntestatario = v; renderChips(); render(); }

// ── Render ────────────────────────────────────────────────
function diffGiorni(data) {
    return Math.ceil((new Date(data) - new Date()) / 86400000);
}

function statoDoc(item) {
    if (!item.data_scadenza) return 'noscad';
    const diff = diffGiorni(item.data_scadenza);
    if (diff < 0) return 'scaduto';
    if (diff <= 90) return 'presto';
    return 'valido';
}

function render() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    let list = items;
    if (filtroIntestatario !== 'Tutti') list = list.filter(i => i.intestatario === filtroIntestatario);
    if (q) list = list.filter(i =>
        i.nome.toLowerCase().includes(q) ||
        (i.intestatario || '').toLowerCase().includes(q) ||
        (i.numero || '').toLowerCase().includes(q) ||
        (TIPI_MAP[i.tipo]?.label || '').toLowerCase().includes(q)
    );

    const body = document.getElementById('listBody');
    if (!list.length) {
        body.innerHTML = `<div class="empty-msg">Nessun documento trovato.<br>Tocca + per aggiungerne uno.</div>`;
        return;
    }

    // Raggruppa per stato scadenza
    const gruppi = {
        'Scaduti': list.filter(i => statoDoc(i) === 'scaduto'),
        'In scadenza (entro 90 giorni)': list.filter(i => statoDoc(i) === 'presto'),
        'Validi': list.filter(i => statoDoc(i) === 'valido'),
        'Senza scadenza': list.filter(i => statoDoc(i) === 'noscad'),
    };

    body.innerHTML = Object.entries(gruppi).filter(([, arr]) => arr.length).map(([label, arr]) =>
        `<div class="section-label">${label}</div>` +
        arr.map(i => {
            const stato = statoDoc(i);
            const tipo = TIPI_MAP[i.tipo] || TIPI_MAP['altro'];
            const semCol = stato === 'scaduto' ? 'rosso' : stato === 'presto' ? 'arancione' : stato === 'valido' ? 'verde' : 'grigio';
            const badgeCol = stato === 'scaduto' ? 'badge-rosso' : stato === 'presto' ? 'badge-arancione' : stato === 'valido' ? 'badge-verde' : 'badge-grey';
            let scadLabel = '';
            if (i.data_scadenza) {
                const diff = diffGiorni(i.data_scadenza);
                const dataFmt = new Date(i.data_scadenza + 'T00:00:00').toLocaleDateString('it-IT', { day: 'numeric', month: 'short', year: 'numeric' });
                scadLabel = diff < 0 ? `Scaduto ${Math.abs(diff)}gg fa` : diff === 0 ? 'Scade oggi' : diff <= 90 ? `Scade tra ${diff}gg` : `Valido fino al ${dataFmt}`;
            }
            return `<div class="doc-card" onclick="apriModifica(${i.id})">
                <div class="semaforo ${semCol}"></div>
                <div class="doc-emoji">${tipo.emoji}</div>
                <div class="doc-body">
                    <div class="doc-nome">${esc(i.nome)}</div>
                    ${i.intestatario ? `<div class="doc-intestatario">${esc(i.intestatario)}</div>` : ''}
                    ${i.numero ? `<div class="doc-numero">${esc(i.numero)}</div>` : ''}
                    <div class="doc-meta">
                        <span class="badge badge-tipo">${tipo.label}</span>
                        ${scadLabel ? `<span class="badge ${badgeCol}">${scadLabel}</span>` : ''}
                    </div>
                </div>
            </div>`;
        }).join('')
    ).join('');
}

// ── Modal ─────────────────────────────────────────────────
function apriNuovo() {
    editId = null;
    tipoSel = 'carta_identita';
    document.getElementById('modalTitle').textContent = 'Nuovo documento';
    document.getElementById('fNome').value = '';
    document.getElementById('fIntestatario').value = '';
    document.getElementById('fNumero').value = '';
    document.getElementById('fEnte').value = '';
    document.getElementById('fRilascio').value = '';
    document.getElementById('fScadenza').value = '';
    document.getElementById('fNote').value = '';
    document.getElementById('btnElimina').style.display = 'none';
    buildTipoGrid();
    document.getElementById('modale').classList.add('open');
}

function apriModifica(id) {
    const i = items.find(x => x.id === id);
    if (!i) return;
    editId = id;
    tipoSel = i.tipo || 'altro';
    document.getElementById('modalTitle').textContent = 'Modifica documento';
    document.getElementById('fNome').value = i.nome || '';
    document.getElementById('fIntestatario').value = i.intestatario || '';
    document.getElementById('fNumero').value = i.numero || '';
    document.getElementById('fEnte').value = i.ente_rilascio || '';
    document.getElementById('fRilascio').value = i.data_rilascio || '';
    document.getElementById('fScadenza').value = i.data_scadenza || '';
    document.getElementById('fNote').value = i.note || '';
    document.getElementById('btnElimina').style.display = '';
    buildTipoGrid();
    document.getElementById('modale').classList.add('open');
}

async function salva() {
    const nome = document.getElementById('fNome').value.trim();
    if (!nome) { toast('Inserisci un nome'); return; }
    const row = {
        email_utente: userEmail,
        nome,
        tipo: tipoSel,
        intestatario: document.getElementById('fIntestatario').value.trim() || null,
        numero: document.getElementById('fNumero').value.trim() || null,
        ente_rilascio: document.getElementById('fEnte').value.trim() || null,
        data_rilascio: document.getElementById('fRilascio').value || null,
        data_scadenza: document.getElementById('fScadenza').value || null,
        note: document.getElementById('fNote').value.trim() || null,
    };
    let err;
    if (editId) {
        ({ error: err } = await sb.from('documenti').update(row).eq('id', editId));
    } else {
        ({ error: err } = await sb.from('documenti').insert(row));
    }
    if (err) { toast('Errore: ' + err.message); return; }
    document.getElementById('modale').classList.remove('open');
    toast(editId ? '✓ Aggiornato' : '✓ Documento aggiunto');
    await carica();
}

async function elimina() {
    if (!editId || !confirm('Eliminare questo documento?')) return;
    await sb.from('documenti').delete().eq('id', editId);
    document.getElementById('modale').classList.remove('open');
    toast('Eliminato');
    await carica();
}

document.getElementById('modale').addEventListener('click', e => {
    if (e.target === document.getElementById('modale')) document.getElementById('modale').classList.remove('open');
});

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

let toastTimer;
function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}

carica();

function _fbApri() { document.getElementById('fbOverlay').classList.add('open'); document.getElementById('fbTesto').focus(); }
function _fbChiudi() { document.getElementById('fbOverlay').classList.remove('open'); document.getElementById('fbTesto').value = ''; }
async function _fbInvia() {
    const testo = document.getElementById('fbTesto').value.trim();
    if (!testo) return;
    const tipo = document.querySelector('input[name="fbTipo"]:checked').value;
    const btn = document.getElementById('fbSendBtn');
    btn.disabled = true; btn.textContent = 'Invio…';
    try {
        const r = await fetch('/api/feedback', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ email: userEmail, tipo, testo }) });
        if (r.ok) { _fbChiudi(); toast('Feedback inviato, grazie!'); }
    } catch(e) {}
    finally { btn.disabled = false; btn.textContent = 'Invia'; }
}
</script>

<button class="fab-feedback" onclick="_fbApri()" title="Invia feedback">
    <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
</button>
<div class="fb-overlay" id="fbOverlay" onclick="if(event.target===this)_fbChiudi()">
    <div class="fb-sheet">
        <h3>Dai il tuo feedback</h3>
        <div class="fb-tipo">
            <input type="radio" name="fbTipo" id="fbSug" value="suggerimento" checked>
            <label for="fbSug">Suggerimento</label>
            <input type="radio" name="fbTipo" id="fbErr" value="errore">
            <label for="fbErr">Segnala errore</label>
        </div>
        <textarea class="fb-textarea" id="fbTesto" rows="4" placeholder="Descrivi il problema o il suggerimento…"></textarea>
        <button class="fb-send" id="fbSendBtn" onclick="_fbInvia()">Invia</button>
    </div>
</div>
</body>
</html>

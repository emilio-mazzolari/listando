<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Listando - In Vendita</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icon-pwa-512.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Listando">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { color-scheme:light; --teal:#16a34a; --teal-d:#15803d; --grey:#d8dddc; --grey-l:#f2f2f7; --dark:#111; --bg:#f5f6f8; --white:#fff; --red:#ff3b30; }
        * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        html,body { overflow-x:hidden; max-width:100%; margin:0; }
        body { font-family:'Segoe UI',system-ui,sans-serif; background:var(--bg); color:var(--dark); padding-bottom:90px; }

        /* Header */
        .page-header { position:sticky; top:0; z-index:100; background:var(--white); border-bottom:2px solid var(--grey-l); padding:14px 16px; padding-top:max(14px,env(safe-area-inset-top,14px)); }
        .header-top { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
        .btn-back { width:40px; height:40px; border-radius:12px; border:2.5px solid var(--grey); background:var(--white); display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; }
        .btn-back svg { width:18px; height:18px; stroke:var(--dark); fill:none; stroke-width:2.5; }
        .header-title { font-weight:900; font-size:18px; flex:1; }
        .tab-row { display:flex; gap:8px; }
        .tab-btn { flex:1; padding:9px; border-radius:12px; border:2px solid var(--grey); background:var(--white); font-weight:800; font-size:13px; cursor:pointer; font-family:inherit; color:#666; transition:all .15s; }
        .tab-btn.active { background:var(--teal); border-color:var(--teal); color:var(--white); }

        /* Search */
        .search-wrap { padding:10px 12px 4px; }
        .search-bar { width:100%; padding:10px 14px; border-radius:14px; border:2px solid var(--grey); font-size:15px; font-family:inherit; outline:none; background:var(--white); }
        .search-bar:focus { border-color:var(--teal); }

        /* Grid */
        .listings-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:10px; padding:10px; max-width:1400px; margin:0 auto; }
        .listing-card { background:var(--white); border-radius:16px; overflow:hidden; box-shadow:0 1px 5px rgba(0,0,0,.09); cursor:pointer; position:relative; transition:transform .12s; }
        .listing-card:active { transform:scale(0.96); }
        .listing-photo { width:100%; aspect-ratio:1; object-fit:cover; background:#eee; display:block; }
        .listing-no-photo { width:100%; aspect-ratio:1; background:linear-gradient(135deg,#e8f5e9,#c8e6c9); display:flex; align-items:center; justify-content:center; font-size:40px; }
        .listing-info { padding:10px 10px 12px; }
        .listing-price { font-weight:900; font-size:17px; color:var(--teal-d); margin-bottom:3px; }
        .listing-title { font-weight:700; font-size:13px; line-height:1.3; margin-bottom:6px; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
        .listing-badges { display:flex; gap:4px; flex-wrap:wrap; }
        .badge { padding:2px 7px; border-radius:6px; font-size:10px; font-weight:800; }
        .bc-nuovo { background:#dcfce7; color:#166534; }
        .bc-ottimo { background:#dbeafe; color:#1e40af; }
        .bc-buono { background:#fef3c7; color:#92400e; }
        .bc-discreto { background:#fce7f3; color:#9d174d; }
        .bs-venduto { background:#fee2e2; color:#991b1b; }
        .bs-riservato { background:#fef3c7; color:#92400e; }
        .badge-mine { position:absolute; top:7px; left:7px; background:rgba(0,0,0,.6); color:white; font-size:9px; font-weight:800; padding:3px 7px; border-radius:7px; }
        .badge-priv { position:absolute; top:7px; right:7px; font-size:12px; }

        /* FAB */
        .fab { position:fixed; bottom:max(24px,env(safe-area-inset-bottom,24px)); right:20px; z-index:100; width:56px; height:56px; border-radius:50%; border:none; background:var(--teal); color:white; font-size:28px; cursor:pointer; box-shadow:0 4px 16px rgba(16,185,129,.4); display:flex; align-items:center; justify-content:center; }

        /* Detail fullscreen */
        .fullscreen { display:none; position:fixed; inset:0; z-index:200; background:var(--bg); overflow-y:auto; }
        .fullscreen.open { display:block; }
        .fs-header { position:sticky; top:0; z-index:10; background:var(--white); border-bottom:1.5px solid var(--grey-l); display:flex; align-items:center; gap:10px; padding:14px 16px; padding-top:max(14px,env(safe-area-inset-top,14px)); }
        .fs-title { font-weight:900; font-size:16px; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .fs-menu-btn { width:36px; height:36px; border-radius:10px; border:none; background:var(--grey-l); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:18px; }

        /* Photo carousel */
        .carousel { position:relative; }
        .carousel-inner { display:flex; overflow-x:auto; scroll-snap-type:x mandatory; scrollbar-width:none; }
        .carousel-inner::-webkit-scrollbar { display:none; }
        .carousel-slide { flex:none; width:100%; scroll-snap-align:start; }
        .carousel-slide img { width:100%; height:280px; object-fit:contain; background:#1a1a1a; display:block; }
        .carousel-dots { position:absolute; bottom:8px; left:50%; transform:translateX(-50%); display:flex; gap:5px; }
        .cdot { width:6px; height:6px; border-radius:50%; background:rgba(255,255,255,.5); }
        .cdot.on { background:white; width:14px; border-radius:3px; }
        .no-photo-big { height:220px; background:linear-gradient(135deg,#e8f5e9,#a7f3d0); display:flex; align-items:center; justify-content:center; font-size:72px; }

        .detail-body { padding:20px 16px; }
        .detail-price { font-size:28px; font-weight:900; color:var(--teal-d); margin-bottom:6px; }
        .detail-title { font-size:20px; font-weight:900; margin-bottom:10px; line-height:1.3; }
        .detail-meta { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
        .detail-desc { font-size:15px; line-height:1.6; color:#444; white-space:pre-wrap; margin-bottom:20px; }
        .seller-row { display:flex; align-items:center; gap:12px; padding:14px; background:var(--grey-l); border-radius:16px; margin-bottom:20px; }
        .seller-av { width:44px; height:44px; border-radius:50%; background:var(--teal); display:flex; align-items:center; justify-content:center; color:white; font-weight:900; font-size:16px; flex-shrink:0; }
        .seller-lbl { font-size:11px; color:#888; font-weight:700; }
        .seller-email { font-size:14px; font-weight:800; word-break:break-all; }

        .btn-chat { width:100%; padding:15px; border-radius:18px; border:none; background:var(--teal); color:white; font-weight:900; font-size:16px; cursor:pointer; font-family:inherit; margin-bottom:10px; }
        .btn-outline { width:100%; padding:13px; border-radius:18px; border:2px solid var(--grey); background:var(--white); color:var(--dark); font-weight:800; font-size:14px; cursor:pointer; font-family:inherit; margin-bottom:8px; }
        .btn-danger { width:100%; padding:13px; border-radius:18px; border:none; background:#fff0f0; color:var(--red); font-weight:800; font-size:14px; cursor:pointer; font-family:inherit; margin-bottom:8px; }
        .stato-row { display:flex; gap:8px; margin-bottom:12px; }
        .btn-stato { flex:1; padding:10px 4px; border-radius:12px; border:2px solid var(--grey); background:var(--white); font-weight:800; font-size:11px; cursor:pointer; font-family:inherit; }
        .btn-stato.on { border-color:var(--teal); background:var(--teal); color:white; }
        .section-title { font-weight:900; font-size:14px; margin:16px 0 10px; color:#666; text-transform:uppercase; letter-spacing:.5px; }
        .conv-item { display:flex; align-items:center; gap:12px; padding:12px 14px; background:var(--white); border-radius:14px; margin-bottom:8px; cursor:pointer; border:1.5px solid var(--grey-l); }
        .conv-av { width:36px; height:36px; border-radius:50%; background:var(--teal); color:white; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:13px; flex-shrink:0; }
        .conv-email { font-size:13px; font-weight:700; }
        .conv-preview { font-size:12px; color:#888; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .unread-dot { width:10px; height:10px; border-radius:50%; background:var(--teal); flex-shrink:0; }

        /* Modal bottom sheet */
        .modal-ov { display:none; position:fixed; inset:0; z-index:300; background:rgba(0,0,0,.5); align-items:flex-end; justify-content:center; }
        .modal-ov.open { display:flex; }
        .modal-box { border-radius:28px 28px 0 0; background:var(--white); padding:20px; padding-bottom:max(20px,env(safe-area-inset-bottom,20px)); width:100%; max-width:500px; max-height:92vh; overflow-y:auto; }
        .modal-handle { width:40px; height:4px; background:rgba(0,0,0,.15); border-radius:4px; margin:0 auto 16px; }
        .modal-title { font-weight:900; font-size:18px; margin-bottom:16px; }
        .form-label { font-size:11px; font-weight:800; color:#888; margin-bottom:5px; margin-top:12px; display:block; text-transform:uppercase; letter-spacing:.5px; }
        .form-input { width:100%; padding:12px 14px; border-radius:14px; border:2px solid rgba(0,0,0,.12); font-size:15px; font-family:inherit; outline:none; background:#fafafa; margin-bottom:2px; }
        .form-textarea { width:100%; padding:12px 14px; border-radius:14px; border:2px solid rgba(0,0,0,.12); font-size:15px; font-family:inherit; outline:none; resize:none; min-height:100px; background:#fafafa; }
        .form-input:focus,.form-textarea:focus { border-color:var(--teal); }
        .pill-row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:2px; }
        .pill { padding:8px 14px; border-radius:20px; border:2px solid var(--grey); font-size:13px; font-weight:700; cursor:pointer; background:var(--white); font-family:inherit; }
        .pill.on { border-color:var(--teal); background:var(--teal); color:white; }
        .cat-select { width:100%; border:2px solid rgba(0,0,0,.12); border-radius:14px; font-size:14px; font-family:inherit; font-weight:600; background:#fafafa; outline:none; padding:4px 0; margin-bottom:2px; cursor:pointer; }
        .cat-select:focus { border-color:var(--teal); }
        .cat-select option { padding:9px 14px; font-size:14px; }
        .cat-select option:checked { background:var(--teal); color:white; }
        .luogo-opt { padding:11px 14px; cursor:pointer; border-bottom:1px solid #f0f0f0; font-size:14px; }
        .luogo-opt:last-child { border-bottom:none; }
        .luogo-opt:hover { background:#f5f5f5; }

        /* Photo slots */
        .photo-row { display:flex; gap:8px; margin:4px 0 10px; }
        .photo-slot { width:72px; height:72px; border-radius:14px; border:2.5px dashed var(--grey); background:var(--grey-l); display:flex; align-items:center; justify-content:center; cursor:pointer; position:relative; flex-shrink:0; overflow:hidden; }
        .photo-slot img { width:100%; height:100%; object-fit:cover; }
        .photo-slot .rm { position:absolute; top:2px; right:2px; width:20px; height:20px; border-radius:50%; background:rgba(0,0,0,.7); color:white; font-size:11px; display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:2; border:none; }
        .photo-add-icon { font-size:22px; color:#bbb; }

        /* Selezionati tag input */
        .sel-wrap { display:none; }
        .sel-wrap.open { display:block; }
        .sel-tags { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; min-height:28px; }
        .sel-tag { display:inline-flex; align-items:center; gap:5px; background:#e8f5e9; border:1.5px solid #a7f3d0; padding:4px 10px; border-radius:20px; font-size:12px; font-weight:700; }
        .sel-tag button { border:none; background:none; cursor:pointer; color:#555; font-size:13px; padding:0; line-height:1; }

        .btn-save { width:100%; padding:15px; border-radius:18px; border:none; background:var(--teal); color:white; font-weight:900; font-size:16px; cursor:pointer; font-family:inherit; margin-top:12px; }
        .btn-del-m { width:100%; padding:13px; border-radius:18px; border:none; background:#fff0f0; color:var(--red); font-weight:800; font-size:14px; cursor:pointer; font-family:inherit; margin-top:8px; }

        /* Chat screen */
        .chat-screen { display:none; position:fixed; inset:0; z-index:400; background:var(--bg); flex-direction:column; }
        .chat-screen.open { display:flex; }
        .chat-hdr { background:var(--white); border-bottom:1.5px solid var(--grey-l); padding:14px 16px; padding-top:max(14px,env(safe-area-inset-top,14px)); display:flex; align-items:center; gap:10px; flex-shrink:0; }
        .chat-hdr-info { flex:1; min-width:0; }
        .chat-hdr-title { font-weight:900; font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .chat-hdr-sub { font-size:11px; color:#888; font-weight:600; }
        .chat-msgs { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
        .msg-wrap { display:flex; flex-direction:column; max-width:75%; }
        .msg-wrap.me { align-self:flex-end; align-items:flex-end; }
        .msg-wrap.other { align-self:flex-start; align-items:flex-start; }
        .bubble { padding:10px 14px; border-radius:18px; font-size:14px; line-height:1.4; }
        .me .bubble { background:var(--teal); color:white; border-bottom-right-radius:4px; }
        .other .bubble { background:var(--white); border:1.5px solid var(--grey); border-bottom-left-radius:4px; }
        .msg-time { font-size:10px; color:#aaa; margin-top:3px; }
        .chat-bar { background:var(--white); border-top:1.5px solid var(--grey-l); padding:12px 16px; padding-bottom:max(12px,env(safe-area-inset-bottom,12px)); display:flex; gap:10px; align-items:flex-end; flex-shrink:0; }
        .chat-input { flex:1; padding:11px 14px; border-radius:22px; border:2px solid var(--grey); font-size:15px; font-family:inherit; outline:none; resize:none; max-height:100px; }
        .chat-input:focus { border-color:var(--teal); }
        .btn-send { width:44px; height:44px; border-radius:50%; border:none; background:var(--teal); color:white; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; }
        .btn-send svg { width:18px; height:18px; fill:none; stroke:white; stroke-width:2.5; }
        .no-chat { text-align:center; color:#bbb; font-weight:700; font-size:14px; padding:30px 0; }

        .tab-badge { display:none; min-width:18px; height:18px; padding:0 5px; border-radius:9px; background:var(--red); color:white; font-size:11px; line-height:18px; margin-left:4px; }
        .tab-badge.on { display:inline-block; }
        .msg-list { grid-column:1/-1; }
        .msg-thumb { width:44px; height:44px; border-radius:10px; object-fit:cover; flex-shrink:0; background:#e8f5e9; display:flex; align-items:center; justify-content:center; font-size:20px; }
        .conv-title { font-size:13px; font-weight:900; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .conv-time { font-size:10px; color:#aaa; font-weight:700; flex-shrink:0; }
        .deliv-box { background:var(--white); border:1.5px solid var(--grey-l); border-radius:16px; padding:14px; margin-bottom:16px; }
        .deliv-row { font-size:14px; font-weight:700; margin-bottom:6px; }
        .deliv-sub { font-size:12px; color:#777; font-weight:600; margin-bottom:10px; }
        .btn-sped { width:100%; padding:12px; border-radius:14px; border:2px solid #f97316; background:#fff7ed; color:#c2410c; font-weight:900; font-size:14px; cursor:pointer; font-family:inherit; }
        .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
        .quick-row { display:none; gap:6px; padding:8px 16px 0; background:var(--white); border-top:1.5px solid var(--grey-l); flex-shrink:0; overflow-x:auto; }
        .quick-row.on { display:flex; }
        .quick-chip { flex:none; padding:6px 12px; border-radius:16px; border:1.5px solid var(--grey); background:var(--white); font-size:12px; font-weight:700; cursor:pointer; font-family:inherit; }
        .empty-msg { text-align:center; padding:60px 24px; color:#bbb; font-weight:700; font-size:15px; grid-column:span 2; }
        .toast { position:fixed; bottom:90px; left:50%; transform:translateX(-50%) translateY(20px); background:rgba(0,0,0,.85); color:white; padding:12px 20px; border-radius:14px; font-weight:700; font-size:14px; opacity:0; transition:all .25s; z-index:9999; pointer-events:none; max-width:calc(100% - 32px); width:max-content; text-align:center; }
        .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
        .spin-ov { display:none; position:fixed; inset:0; z-index:9998; background:rgba(0,0,0,.35); align-items:center; justify-content:center; }
        .spin-ov.open { display:flex; }
        .spinner { width:48px; height:48px; border:5px solid rgba(255,255,255,.3); border-top-color:white; border-radius:50%; animation:spin .8s linear infinite; }
        @keyframes spin { to { transform:rotate(360deg); } }
    
        /* ── Feedback fab ── */
        .fab-feedback { position: fixed; bottom: 88px; right: 18px; width: 46px; height: 46px; border-radius: 50%; background: #fff; border: 2.5px solid #e0e0e0; box-shadow: 0 2px 10px rgba(0,0,0,.12); display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 200; }
        .fab-feedback svg { width: 20px; height: 20px; stroke: #777; fill: none; stroke-width: 2; }
        .fb-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 999; display: none; align-items: flex-end; justify-content: center; padding-bottom: env(safe-area-inset-bottom,0); }
        .fb-overlay.open { display: flex; }
        .fb-sheet { background: #fff; border-radius: 24px 24px 0 0; padding: 24px 20px 40px; width: 100%; max-width: 520px; }
        .fb-sheet h3 { margin: 0 0 16px; font-size: 17px; font-weight: 800; }
        .fb-tipo { display: flex; gap: 10px; margin-bottom: 14px; }
        .fb-tipo input[type=radio] { display: none; }
        .fb-tipo label { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 10px; border-radius: 12px; border: 2px solid #e0e0e0; font-size: 14px; font-weight: 600; cursor: pointer; transition: all .15s; }
        .fb-tipo input[type=radio]:checked + label { border-color: var(--accent,#5856d6); background: color-mix(in srgb,var(--accent,#5856d6) 12%,#fff); color: var(--accent,#5856d6); }
        .fb-textarea { width: 100%; padding: 12px 14px; border-radius: 14px; border: 2.5px solid #e0e0e0; font-size: 15px; font-family: inherit; resize: none; outline: none; box-sizing: border-box; }
        .fb-textarea:focus { border-color: var(--accent,#5856d6); }
        .fb-send { width: 100%; margin-top: 14px; padding: 14px; border-radius: 14px; background: var(--accent,#5856d6); color: #fff; font-size: 16px; font-weight: 700; border: none; cursor: pointer; }
    </style>
</head>
<body>

<!-- Header + tabs -->
<div class="page-header">
    <div class="header-top">
        <button class="btn-back" onclick="history.back()">
            <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <div class="header-title">VENDO E COMPRO</div>
    </div>
    <div class="tab-row">
        <button class="tab-btn active" id="tabScopri" onclick="switchTab('scopri')">🔍 Scopri</button>
        <button class="tab-btn" id="tabMiei" onclick="switchTab('miei')">📦 I miei</button>
        <button class="tab-btn" id="tabMsg" onclick="switchTab('msg')">💬 Messaggi<span class="tab-badge" id="msgBadge"></span></button>
    </div>
</div>

<div class="search-wrap">
    <input class="search-bar" id="searchInput" type="search" placeholder="🔍  Cerca annunci…" oninput="renderGrid(this.value)">
</div>

<div class="listings-grid" id="listingsGrid"></div>

<button class="fab" onclick="apriNuovo()">+</button>

<!-- ───── Detail overlay ───── -->
<div class="fullscreen" id="detailOv">
    <div class="fs-header">
        <button class="btn-back" onclick="chiudiDettaglio()">
            <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <div class="fs-title" id="detailHdrTitle"></div>
        <button class="fs-menu-btn" id="detailEditBtn" style="display:none" onclick="apriModifica()">✏️</button>
    </div>
    <div id="detailContent"></div>
</div>

<!-- ───── Create/Edit modal ───── -->
<div class="modal-ov" id="modaleAnnuncio">
    <div class="modal-box">
        <div class="modal-handle"></div>
        <div class="modal-title" id="modaleTitolo">Nuovo annuncio</div>

        <label class="form-label">Foto (max 4)</label>
        <div class="photo-row" id="photoRow"></div>
        <input type="file" id="fileInput" accept="image/*" multiple style="position:absolute;width:0;height:0;opacity:0;pointer-events:none" onchange="onFileChange(this)">

        <label class="form-label">Titolo *</label>
        <input class="form-input" id="fTitolo" placeholder="Cosa vendi?" type="text">

        <label style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;cursor:pointer;margin-top:10px;color:#555">
            <input type="checkbox" id="fPerConto" style="width:17px;height:17px;accent-color:var(--teal);cursor:pointer">
            Vendo per conto di un'altra persona
        </label>
        <div id="perContoWrap" style="display:none;margin-top:6px">
            <input class="form-input" id="fPerContoNome" placeholder="Nome del proprietario" type="text">
        </div>

        <label class="form-label">Prezzo (€)</label>
        <div style="display:flex;gap:10px;align-items:center;margin-bottom:2px">

<script>
const SUPABASE_URL = "https://eejdpophfxsrqdvsucye.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVlamRwb3BoZnhzcnFkdnN1Y3llIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc2NTMzMDQsImV4cCI6MjA5MzIyOTMwNH0.mpxbwlJyIdZgqKIdutHbLd85JR1P11yiglbYeApi17k";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const userEmail = localStorage.getItem('userEmail');
if (!userEmail) { localStorage.setItem('pendingUrl', location.pathname + location.search); location.href = 'login.html'; }

const CONDIZIONI = ['Nuovo','Ottimo','Buono','Discreto'];
const CATEGORIE  = [
    'Abbigliamento','Accessori & Borse','Antichità & Collezionismo',
    'Arte & Artigianato','Auto / Moto / Veicoli','Bambini & Neonati',
    'Biciclette','Casa & Arredamento','Cucina & Elettrodomestici',
    'Elettronica & Informatica','Fotografia','Giardinaggio & Outdoor',
    'Giochi & Giocattoli','Libri & Riviste','Materiale scolastico',

    'Telefoni & Smartphone','Utensili & Bricolage','Videogiochi & Console',
    'Viaggi & Valigie','Altro'
];
const VIS_LABELS = { privato:'🔒 Solo io', selezionati:'👥 Selezionati', pubblico:'🌍 Tutti' };
const CONS_LABELS = { ritiro:'🤝 Ritiro a mano', spedizione:'📦 Spedizione', entrambi:'🤝📦 Entrambi' };
const SPEDIAMO_URL = 'https://www.spediamo.it/';

let annunci = [], miei = [], currentTab = 'scopri';
let selectedAnnuncio = null;
let editId = null;
let fCond = 'buono', fCat = 'Altro', fVis = 'pubblico', fCons = 'ritiro', fTrattabile = false, fPerConto = false;
let photoSlots = [null, null, null, null]; // { type:'existing'|'new', url, file, id }
let selEmails = [];
let chatAnnuncioId = null, chatPartner = null, chatRealtime = null;
let chatSeen = new Set(), chatLastId = 0, chatPollTimer = null;
let conversazioni = [];

// ── Data loading ──────────────────────────────────────────
async function carica() {
    if (currentTab === 'scopri') await caricaScopri();
    else if (currentTab === 'miei') await caricaMiei();
    else await caricaMessaggi();
    aggiornaBadge();
}

async function caricaScopri() {
    const { data: pub } = await sb.from('vendita_annunci')
        .select('*, vendita_foto(id,url,ordine)')
        .eq('visibilita', 'pubblico')
        .order('created_at', { ascending: false });

    const { data: myAccess } = await sb.from('vendita_accesso')
        .select('annuncio_id').eq('email_utente', userEmail);

    let sel = [];
    if (myAccess?.length) {
        const ids = myAccess.map(a => a.annuncio_id);
        const { data } = await sb.from('vendita_annunci')
            .select('*, vendita_foto(id,url,ordine)')
            .in('id', ids);
        sel = data || [];
    }

    const seen = new Set();
    annunci = [...(pub || []), ...sel].filter(a => {
        if (seen.has(a.id)) return false;
        seen.add(a.id);
        sortFoto(a);
        return true;
    });
    renderGrid(document.getElementById('searchInput').value);
}

async function caricaMiei() {
    const { data } = await sb.from('vendita_annunci')
        .select('*, vendita_foto(id,url,ordine)')
        .eq('email_utente', userEmail)
        .order('created_at', { ascending: false });
    miei = (data || []).map(a => { sortFoto(a); return a; });
    renderGrid(document.getElementById('searchInput').value);
}

function sortFoto(a) {
    if (a.vendita_foto) a.vendita_foto.sort((x, y) => x.ordine - y.ordine);
}

// ── Tabs ──────────────────────────────────────────────────
function switchTab(tab) {
    currentTab = tab;
    document.getElementById('tabScopri').classList.toggle('active', tab === 'scopri');
    document.getElementById('tabMiei').classList.toggle('active', tab === 'miei');
    document.getElementById('tabMsg').classList.toggle('active', tab === 'msg');
    document.getElementById('searchInput').placeholder = tab === 'msg' ? '🔍  Cerca conversazioni…' : '🔍  Cerca annunci…';
    document.getElementById('listingsGrid').innerHTML = '';
    carica();
}

// ── Grid render ───────────────────────────────────────────
function renderGrid(q = '') {
    if (currentTab === 'msg') return renderMessaggi(q);
    const grid = document.getElementById('listingsGrid');
    const low = q.toLowerCase();
    const list = (currentTab === 'scopri' ? annunci : miei).filter(a =>
        !q || a.titolo.toLowerCase().includes(low) || (a.descrizione || '').toLowerCase().includes(low));

    if (!list.length) {
        grid.innerHTML = `<div class="empty-msg">${currentTab === 'scopri' ? '🏪 Nessun annuncio disponibile' : '📦 Nessun annuncio — tocca + per crearne uno'}</div>`;
        return;
    }
    grid.innerHTML = list.map(cardHtml).join('');
}

function cardHtml(a) {
    const foto = a.vendita_foto?.[0];
    const photoEl = foto
        ? `<img class="listing-photo" src="${foto.url}" loading="lazy">`
        : `<div class="listing-no-photo">🏷️</div>`;
    const prezzo = a.prezzo != null ? `€ ${Number(a.prezzo).toFixed(2).replace('.', ',')}` : 'Prezzo libero';
    const cond = (a.condizione || 'buono').toLowerCase();
    const statoBadge = a.stato !== 'attivo'
        ? `<span class="badge bs-${a.stato}">${a.stato === 'venduto' ? 'Venduto' : 'Riservato'}</span>` : '';
    const mineBadge = a.email_utente === userEmail ? `<div class="badge-mine">Mio</div>` : '';
    const privBadge = a.visibilita === 'privato' ? `<div class="badge-priv">🔒</div>` : (a.visibilita === 'selezionati' ? `<div class="badge-priv">👥</div>` : '');
    return `<div class="listing-card" onclick="apriDettaglio(${a.id})">
        ${mineBadge}${privBadge}
        ${photoEl}
        <div class="listing-info">
            <div class="listing-price">${prezzo}</div>
            <div class="listing-title">${esc(a.titolo)}</div>
            <div class="listing-badges">
                <span class="badge bc-${cond}">${ucFirst(cond)}</span>
                ${statoBadge}
            </div>
        </div>
    </div>`;
}

// ── Detail ────────────────────────────────────────────────
async function apriDettaglio(id) {
    const a = [...annunci, ...miei].find(x => x.id === id);
    if (!a) return;
    selectedAnnuncio = a;
    document.getElementById('detailHdrTitle').textContent = a.titolo;
    document.getElementById('detailEditBtn').style.display = a.email_utente === userEmail ? '' : 'none';
    document.getElementById('detailContent').innerHTML = buildDetailHtml(a);
    bindCarouselDots();
    if (a.email_utente === userEmail) await loadConversazioni(a.id);
    document.getElementById('detailOv').classList.add('open');
}

function chiudiDettaglio() {
    document.getElementById('detailOv').classList.remove('open');
    selectedAnnuncio = null;
}

function buildDetailHtml(a) {
    const foto = a.vendita_foto || [];
    let carouselHtml;
    if (foto.length) {
        const isMine = a.email_utente === userEmail;
        const slides = foto.map((f, i) => `<div class="carousel-slide" data-url="${f.url}" data-idx="${i}"><img src="${f.url}" alt=""></div>`).join('');
        const dots = foto.length > 1 ? `<div class="carousel-dots">${foto.map((_, i) => `<div class="cdot${i === 0 ? ' on' : ''}"></div>`).join('')}</div>` : '';
        const dlBtn = isMine ? `<button onclick="scaricaFotoCorrente()" style="position:absolute;top:10px;right:10px;z-index:5;background:rgba(0,0,0,.55);border:none;border-radius:10px;padding:8px 12px;color:white;font-size:18px;cursor:pointer;" title="Scarica foto">⬇️</button>` : '';
        carouselHtml = `<div class="carousel" style="position:relative"><div class="carousel-inner" id="carouselInner">${slides}</div>${dots}${dlBtn}</div>`;
    } else {
        carouselHtml = `<div class="no-photo-big">🏷️</div>`;
    }

    const prezzo = a.prezzo != null ? `€ ${Number(a.prezzo).toFixed(2).replace('.', ',')}` : 'Prezzo libero';
    const cond = (a.condizione || 'buono').toLowerCase();
    const condBadge = `<span class="badge bc-${cond}" style="padding:5px 12px;font-size:12px">${ucFirst(cond)}</span>`;
    const catBadge = a.categoria ? `<span class="badge" style="background:#f0f0f0;color:#555;padding:5px 12px;font-size:12px">${a.categoria}</span>` : '';
    const statoBadge = a.stato !== 'attivo'
        ? `<span class="badge bs-${a.stato}" style="padding:5px 12px;font-size:12px">${a.stato === 'venduto' ? '✓ Venduto' : '⏳ Riservato'}</span>` : '';

    const initials = (a.email_utente || '?')[0].toUpperCase();
    const sellerHtml = `<div class="seller-row">
        <div class="seller-av">${initials}</div>
        <div><div class="seller-lbl">Venditore</div><div class="seller-email">${esc(a.email_utente)}</div></div>
    </div>`;

    const consegnaHtml = buildConsegnaHtml(a);

    let actionsHtml = '';
    if (a.email_utente === userEmail) {
        actionsHtml = `
            <div class="section-title">Stato annuncio</div>
            <div class="stato-row">
                <button class="btn-stato${a.stato==='attivo'?' on':''}" onclick="aggiornaStato('attivo')">Attivo</button>
                <button class="btn-stato${a.stato==='riservato'?' on':''}" onclick="aggiornaStato('riservato')">Riservato</button>
                <button class="btn-stato${a.stato==='venduto'?' on':''}" onclick="aggiornaStato('venduto')">Venduto</button>
            </div>
            <div class="section-title">Conversazioni</div>
            <div id="convList"><div class="no-chat">Caricamento…</div></div>`;
    } else if (a.stato === 'attivo') {
        actionsHtml = `<button class="btn-chat" data-partner="${esc(a.email_utente)}" onclick="apriChat(${a.id}, this.dataset.partner)">💬  Chatta col venditore</button>`;
    } else {
        actionsHtml = `<div style="text-align:center;color:#aaa;font-weight:700;font-size:14px;padding:10px 0">Annuncio non più disponibile</div>`;
    }

    return `${carouselHtml}
    <div class="detail-body">
        <div class="detail-price">${prezzo}</div>
        <div class="detail-title">${esc(a.titolo)}</div>
        <div class="detail-meta">${condBadge}${catBadge}${statoBadge}</div>
        ${a.descrizione ? `<div class="detail-desc">${esc(a.descrizione)}</div>` : ''}
        ${consegnaHtml}
        ${sellerHtml}
        ${a.visibilita === 'pubblico' ? `<button class="btn-outline" onclick="condividiAnnuncio()">📤  Condividi annuncio</button>` : ''}
        ${actionsHtml}
    </div>`;
}

function buildConsegnaHtml(a) {
    const cons = a.consegna || 'ritiro';
    const ritiro = cons === 'ritiro' || cons === 'entrambi';
    const sped = cons === 'spedizione' || cons === 'entrambi';
    const luogo = a.luogo ? esc(a.luogo) : '';
    let html = '<div class="section-title">Consegna</div><div class="deliv-box">';
    if (ritiro) html += `<div class="deliv-row">🤝 Ritiro a mano${luogo ? ` · ${luogo}` : ''}</div>`;
    if (sped) {
        const pacco = [a.sped_peso ? `${String(a.sped_peso).replace('.', ',')} kg` : '', a.sped_dimensioni ? `${esc(a.sped_dimensioni)} cm` : ''].filter(Boolean).join(' · ');
        html += `<div class="deliv-row">📦 Spedizione disponibile</div>
            <div class="deliv-sub">${[luogo && !ritiro ? `Parte da ${luogo}` : (luogo ? `Partenza: ${luogo}` : ''), pacco].filter(Boolean).join(' · ') || 'Concorda i dettagli del pacco col venditore'}<br>Costo di spedizione a carico dell'acquirente, da calcolare su Spediamo.it</div>
            <button class="btn-sped" onclick="apriSpediamo(${a.id})">📦  Calcola e prenota su Spediamo.it</button>`;
    }
    return html + '</div>';
}

// Spediamo.it non accetta parametri precompilati: copiamo i dati del pacco da incollare nel modulo
function apriSpediamo(id) {
    const a = [...annunci, ...miei].find(x => x.id === id) || selectedAnnuncio;
    window.open(SPEDIAMO_URL, '_blank', 'noopener');
    if (!a) return;
    const righe = [
        `Spedizione: ${a.titolo}`,
        a.luogo ? `Partenza: ${a.luogo}` : '',
        a.sped_peso ? `Peso: ${a.sped_peso} kg` : '',
        a.sped_dimensioni ? `Dimensioni: ${a.sped_dimensioni} cm` : ''
    ].filter(Boolean).join('\n');
    navigator.clipboard?.writeText(righe).then(() => toast('📋 Dati del pacco copiati: incollali su Spediamo.it', 3500)).catch(() => {});
}

function scaricaFotoCorrente() {
    const inner = document.getElementById('carouselInner');
    if (!inner) return;
    const idx = Math.round(inner.scrollLeft / inner.clientWidth);
    const slide = inner.querySelectorAll('.carousel-slide')[idx];
    if (!slide) return;
    const url = slide.dataset.url;
    const a = document.createElement('a');
    a.href = url;
    a.download = `foto_${idx + 1}.jpg`;
    a.target = '_blank';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
}

function bindCarouselDots() {
    const inner = document.getElementById('carouselInner');
    if (!inner) return;
    inner.addEventListener('scroll', () => {
        const idx = Math.round(inner.scrollLeft / inner.clientWidth);
        document.querySelectorAll('.cdot').forEach((d, i) => d.classList.toggle('on', i === idx));
    }, { passive: true });
}

async function aggiornaStato(stato) {
    if (!selectedAnnuncio) return;
    await sb.from('vendita_annunci').update({ stato }).eq('id', selectedAnnuncio.id);
    selectedAnnuncio.stato = stato;
    // Refresh detail
    document.getElementById('detailContent').innerHTML = buildDetailHtml(selectedAnnuncio);
    bindCarouselDots();
    await loadConversazioni(selectedAnnuncio.id);
    await carica();
    toast('✓ Stato aggiornato');
}

async function loadConversazioni(annuncioId) {
    const { data } = await sb.from('vendita_chat')
        .select('email_mittente, email_venditore, messaggio, created_at, letto')
        .eq('annuncio_id', annuncioId)
        .order('created_at', { ascending: false });

    const convList = document.getElementById('convList');
    if (!convList) return;

    // Una conversazione per acquirente: l'altro capo di ogni messaggio
    const buyers = new Map();
    for (const m of (data || [])) {
        const partner = m.email_mittente === userEmail ? m.email_venditore : m.email_mittente;
        if (partner === userEmail) continue;
        if (!buyers.has(partner)) buyers.set(partner, { last: m, unread: false });
        if (m.email_mittente === partner && !m.letto) buyers.get(partner).unread = true;
    }
    if (!buyers.size) { convList.innerHTML = '<div class="no-chat">Nessuna conversazione ancora</div>'; return; }

    convList.innerHTML = [...buyers.entries()].map(([email, { last, unread }]) => `
        <div class="conv-item" data-partner="${esc(email)}" onclick="apriChat(${annuncioId}, this.dataset.partner)">
            <div class="conv-av">${esc(email[0].toUpperCase())}</div>
            <div style="flex:1;min-width:0">
                <div class="conv-email">${esc(email)}</div>
                <div class="conv-preview">${last.email_mittente === userEmail ? 'Tu: ' : ''}${esc(last.messaggio)}</div>
            </div>
            ${unread ? '<div class="unread-dot"></div>' : ''}
        </div>`).join('');
}

function apriNuovo() {
    editId = null;

    selEmails = [];
    fCond = 'buono'; fCat = 'Altro'; fVis = 'pubblico'; fCons = 'ritiro'; fTrattabile = false;
    document.getElementById('fLuogo').value = '';
    document.getElementById('fPeso').value = '';
    document.getElementById('fDim').value = '';
    document.getElementById('fTitolo').value = '';
    document.getElementById('fPrezzo').value = '';
    document.getElementById('fDesc').value = '';
    document.getElementById('fMisure').value = '';
    document.getElementById('fPesoOgg').value = '';
    document.getElementById('fTrattabile').checked = false;
    document.getElementById('fPerConto').checked = false;
    document.getElementById('fPerContoNome').value = '';

    document.getElementById('btnDelAnnuncio').style.display = 'none';
    document.getElementById('modaleTitolo').textContent = 'Nuovo annuncio';
    buildFormUI();
    document.getElementById('modaleAnnuncio').classList.add('open');
}

function apriModifica() {
    if (!selectedAnnuncio) return;
    const a = selectedAnnuncio;
    editId = a.id;
    fCond = a.condizione || 'buono'; fCat = a.categoria || 'Altro'; fVis = a.visibilita || 'pubblico'; fCons = a.consegna || 'ritiro'; fTrattabile = !!a.trattabile;
    document.getElementById('fLuogo').value = a.luogo || '';
    document.getElementById('fPeso').value = a.sped_peso != null ? a.sped_peso : '';
    document.getElementById('fDim').value = a.sped_dimensioni || '';
    document.getElementById('fTitolo').value = a.titolo || '';
    document.getElementById('fPrezzo').value = a.prezzo != null ? a.prezzo : '';
    document.getElementById('fDesc').value = a.descrizione || '';
    document.getElementById('fMisure').value = a.misure || '';
    document.getElementById('fPesoOgg').value = a.peso_oggetto || '';
    document.getElementById('fTrattabile').checked = !!a.trattabile;
    document.getElementById('fPerConto').checked = !!a.per_conto;
    document.getElementById('fPerContoNome').value = a.per_conto_nome || '';
    document.getElementById('perContoWrap').style.display = a.per_conto ? '' : 'none';
    document.getElementById('btnDelAnnuncio').style.display = '';
    document.getElementById('modaleTitolo').textContent = 'Modifica annuncio';
    // Load existing photos
    photoSlots = [null, null, null, null];
    (a.vendita_foto || []).forEach((f, i) => {
        if (i < 4) photoSlots[i] = { type: 'existing', url: f.url, id: f.id };
    });
    buildFormUI();
    // Load selezionati emails
    if (fVis === 'selezionati') loadSelezionati(a.id);
    document.getElementById('modaleAnnuncio').classList.add('open');
}

async function loadSelezionati(annuncioId) {
    const { data } = await sb.from('vendita_accesso').select('email_utente').eq('annuncio_id', annuncioId);
    selEmails = (data || []).map(r => r.email_utente);
    renderSelTags();
}

function buildFormUI() {
    buildPhotoRow();
    renderCondRow();
    renderCatRow();
    renderVisRow();
    renderConsRow();
    toggleSelWrap();
    renderSelTags();
}

function setPill(type, val) {
    if (type === 'cond') fCond = val;
    else if (type === 'cat') fCat = val;
    else if (type === 'vis') { fVis = val; toggleSelWrap(); }
    else if (type === 'cons') fCons = val;
    renderCondRow(); renderCatRow(); renderVisRow(); renderConsRow();
}

function renderCondRow() {
    const row = document.getElementById('condRow');
    if (!row) return;
    row.innerHTML = CONDIZIONI.map(c => {
        const val = c.toLowerCase();
        return `<button class="pill${val === fCond ? ' on' : ''}" onclick="setPill('cond','${val}')">${c}</button>`;
    }).join('');
}

function renderCatRow() {
    const sel = document.getElementById('catSelect');
    if (!sel) return;
    sel.innerHTML = CATEGORIE.map(c => `<option value="${c}">${c}</option>`).join('');
    sel.value = fCat;
}

function renderVisRow() {
    const row = document.getElementById('visRow');
    if (!row) return;
    row.innerHTML = Object.keys(VIS_LABELS).map(v =>
        `<button class="pill${v === fVis ? ' on' : ''}" onclick="setPill('vis','${v}')">${VIS_LABELS[v]}</button>`
    ).join('');
}

function renderConsRow() {
    const row = document.getElementById('consRow');
    if (!row) return;
    row.innerHTML = Object.keys(CONS_LABELS).map(v =>
        `<button class="pill${v === fCons ? ' on' : ''}" onclick="setPill('cons','${v}')">${CONS_LABELS[v]}</button>`
    ).join('');
    document.getElementById('spedWrap').style.display = fCons === 'ritiro' ? 'none' : '';
    document.getElementById('fLuogoLbl').textContent = fCons === 'spedizione' ? 'Spedisco da (città e CAP)' : 'Luogo di ritiro / partenza';
}

function buildPhotoRow() {
    const row = document.getElementById('photoRow');
    const filled = photoSlots.filter(s => s && s.url);
    const hasEmpty = filled.length < 4;
    if (hasEmpty) document.getElementById('fileInput').value = '';
    row.innerHTML = photoSlots.map((slot, i) => {
        if (!slot || !slot.url) return '';
        const realIdx = photoSlots.indexOf(slot);
        const prevFilled = photoSlots.slice(0, realIdx).filter(s => s && s.url).length > 0;
        const nextFilled = photoSlots.slice(realIdx + 1).filter(s => s && s.url).length > 0;
        return `<div class="photo-slot" style="position:relative">
            <img src="${slot.url}" alt="">
            <button class="rm" onclick="removePhoto(${realIdx})">✕</button>
            <div style="position:absolute;bottom:3px;left:50%;transform:translateX(-50%);display:flex;gap:3px">
                ${prevFilled ? `<button onclick="spostaFoto(${realIdx},-1)" style="background:rgba(0,0,0,.55);border:none;border-radius:6px;color:white;font-size:11px;padding:2px 6px;cursor:pointer;line-height:1">‹</button>` : ''}
                <button onclick="ruotaFoto(${realIdx})" style="background:rgba(0,0,0,.55);border:none;border-radius:6px;color:white;font-size:11px;padding:2px 6px;cursor:pointer;line-height:1">↻</button>
                ${nextFilled ? `<button onclick="spostaFoto(${realIdx},+1)" style="background:rgba(0,0,0,.55);border:none;border-radius:6px;color:white;font-size:11px;padding:2px 6px;cursor:pointer;line-height:1">›</button>` : ''}
            </div>
        </div>`;
    }).join('') + (hasEmpty ? `<label class="photo-slot" for="fileInput"><div class="photo-add-icon">+</div></label>` : '');
}

async function ruotaFoto(idx) {
    const slot = photoSlots[idx];
    if (!slot || !slot.url) return;
    const img = new Image();
    img.src = slot.url;
    await new Promise(r => { img.onload = r; });
    const canvas = document.createElement('canvas');
    canvas.width = img.naturalHeight;
    canvas.height = img.naturalWidth;
    const ctx = canvas.getContext('2d');
    ctx.translate(canvas.width / 2, canvas.height / 2);
    ctx.rotate(Math.PI / 2);
    ctx.drawImage(img, -img.naturalWidth / 2, -img.naturalHeight / 2);
    canvas.toBlob(blob => {
        const file = new File([blob], 'foto.jpg', { type: 'image/jpeg' });
        const url = canvas.toDataURL('image/jpeg', 0.9);
        photoSlots[idx] = { type: 'new', url, file };
        buildPhotoRow();
    }, 'image/jpeg', 0.9);
}

function spostaFoto(idx, dir) {
    const targetIdx = idx + dir;
    if (targetIdx < 0 || targetIdx >= photoSlots.length) return;
    [photoSlots[idx], photoSlots[targetIdx]] = [photoSlots[targetIdx], photoSlots[idx]];
    buildPhotoRow();
}

function onFileChange(input) {
    Array.from(input.files).forEach(file => {
        const emptyIdx = photoSlots.findIndex(s => !s);
        if (emptyIdx === -1) return;
        photoSlots[emptyIdx] = { type: 'new', url: null, file };
        const reader = new FileReader();
        reader.onload = e => {
            photoSlots[emptyIdx] = { type: 'new', url: e.target.result, file };
            buildPhotoRow();
        };
        reader.readAsDataURL(file);
    });
}

function removePhoto(idx) {
    photoSlots[idx] = null;
    buildPhotoRow();
}

// ── Autocomplete luogo (Nominatim) ────────────────────────────────
let _luogoTimer = null;
function onLuogoInput(val) {
    clearTimeout(_luogoTimer);
    if (val.length < 2) { chiudiLuogoDropdown(); return; }
    _luogoTimer = setTimeout(() => cercaLuogo(val), 350);
}
async function cercaLuogo(q) {
    const dd = document.getElementById('luogoDropdown');
    try {
        const res = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&addressdetails=1&limit=6&countrycodes=it`, {
            headers: { 'Accept-Language': 'it' }
        });
        const data = await res.json();
        if (!data.length) { chiudiLuogoDropdown(); return; }
        dd.innerHTML = data.map(r => {
            const a = r.address || {};
            const city = a.city || a.town || a.village || a.municipality || a.county || r.display_name.split(',')[0];
            const province = a.state || '';
            const cap = a.postcode || '';
            const label = [city, cap, province].filter(Boolean).join(' ');
            return `<div class="luogo-opt" onmousedown="scegliLuogo('${label.replace(/'/g,"\\'")}')">
                <span style="font-weight:700">${city}</span>
                <span style="color:#aaa;font-size:12px;margin-left:6px">${[cap, province].filter(Boolean).join(' · ')}</span>
            </div>`;
        }).join('');
        dd.style.display = 'block';
    } catch(e) { chiudiLuogoDropdown(); }
}
function scegliLuogo(val) {
    document.getElementById('fLuogo').value = val;
    chiudiLuogoDropdown();
}
function chiudiLuogoDropdown() {
    document.getElementById('luogoDropdown').style.display = 'none';
}

function toggleSelWrap() {
    document.getElementById('selWrap').classList.toggle('open', fVis === 'selezionati');
}

document.getElementById('fPerConto').addEventListener('change', function() {
    document.getElementById('perContoWrap').style.display = this.checked ? '' : 'none';
    if (!this.checked) document.getElementById('fPerContoNome').value = '';
});

document.getElementById('selInput').addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ',') {
        e.preventDefault();
        const val = document.getElementById('selInput').value.trim().toLowerCase();
        if (val && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val) && !selEmails.includes(val)) {
            selEmails.push(val);
            renderSelTags();
        }
        document.getElementById('selInput').value = '';
    }
});

function renderSelTags() {
    document.getElementById('selTags').innerHTML = selEmails.map((e, i) =>
        `<div class="sel-tag">${esc(e)}<button onclick="removeSelEmail(${i})">✕</button></div>`
    ).join('');
}

function removeSelEmail(i) { selEmails.splice(i, 1); renderSelTags(); }

function fileToBase64(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
    });
}

// ── Save ──────────────────────────────────────────────────
async function salva() {
    const titolo = document.getElementById('fTitolo').value.trim();
    if (!titolo) { toast('Inserisci un titolo'); return; }
    const prezzo = document.getElementById('fPrezzo').value.trim();
    const desc = document.getElementById('fDesc').value.trim();

    const row = {
        email_utente: userEmail,
        titolo,
        descrizione: desc || null,
        prezzo: prezzo ? parseFloat(prezzo) : null,
        trattabile: document.getElementById('fTrattabile').checked,
        misure: document.getElementById('fMisure').value.trim() || null,
        peso_oggetto: document.getElementById('fPesoOgg').value.trim() || null,
        per_conto: document.getElementById('fPerConto').checked,
        per_conto_nome: document.getElementById('fPerConto').checked ? (document.getElementById('fPerContoNome').value.trim() || null) : null,
        condizione: fCond,
        categoria: fCat,
        visibilita: fVis,
        updated_at: new Date().toISOString()
    };
    const peso = document.getElementById('fPeso').value.trim();
    const consegna = {
        consegna: fCons,
        luogo: document.getElementById('fLuogo').value.trim() || null,
        sped_peso: fCons !== 'ritiro' && peso ? parseFloat(peso) : null,
        sped_dimensioni: fCons !== 'ritiro' ? (document.getElementById('fDim').value.trim() || null) : null
    };

    spin(true);
    const isNew = !editId;
    let annuncioId = editId;
    const problemi = [];
    try {
        // Se il DB non ha ancora le colonne di consegna (vedi api/run-sql.js) si salva senza
        const scrivi = async full => editId
            ? sb.from('vendita_annunci').update(full).eq('id', editId)
            : sb.from('vendita_annunci').insert({ ...full, stato: 'attivo' }).select().single();
        let { data, error } = await scrivi({ ...row, ...consegna });
        if (error && /consegna|luogo|sped_|column|schema/i.test(errMsg(error))) {
            ({ data, error } = await scrivi(row));
            if (!error) problemi.push('dati di consegna non salvati (database da aggiornare)');
        }
        if (error) throw error;
        if (isNew) {
            annuncioId = data.id;
            // Da qui l'annuncio esiste: un nuovo PUBBLICA dopo un errore lo aggiorna invece di duplicarlo
            editId = annuncioId;
        }
    } catch (e) {
        toast('Errore: ' + errMsg(e));
        spin(false);
        return;
    }

    // L'annuncio è salvato: foto e accessi sono passi secondari, gli errori vengono raccolti

    if (!isNew) {
        // Delete removed existing photos
        const keptIds = photoSlots.filter(s => s?.type === 'existing').map(s => s.id);
        const { data: allFoto } = await sb.from('vendita_foto').select('id,url').eq('annuncio_id', annuncioId);
        for (const f of (allFoto || [])) {
            if (!keptIds.includes(f.id)) {
                const path = storagePathFromUrl(f.url);
                if (path) await sb.storage.from('vendita-foto').remove([path]);
                await sb.from('vendita_foto').delete().eq('id', f.id);
            }
        }
    }

    // Salva foto rispettando l'ordine attuale dei photoSlots
    let ordine = 0;
    for (let i = 0; i < photoSlots.length; i++) {
        const slot = photoSlots[i];
        if (!slot) continue;
        if (slot.type === 'existing') {
            // Aggiorna l'ordine nel DB (gestisce il riordinamento)
            await sb.from('vendita_foto').update({ ordine }).eq('id', slot.id);
            ordine++;
        } else if (slot.type === 'new') {
            try {
                await uploadFoto(slot.file, annuncioId, ordine);
                ordine++;
                photoSlots[i] = null;
            } catch (e) {
                problemi.push('foto: ' + errMsg(e));
            }
        }
    }

    // Handle selezionati access list
    const { error: delErr } = await sb.from('vendita_accesso').delete().eq('annuncio_id', annuncioId);
    if (delErr) problemi.push('accessi: ' + errMsg(delErr));
    if (fVis === 'selezionati' && selEmails.length) {
        const { error: accErr } = await sb.from('vendita_accesso')
            .insert(selEmails.map(email => ({ annuncio_id: annuncioId, email_utente: email })));
        if (accErr) problemi.push('accessi: ' + errMsg(accErr));
    }

    document.getElementById('modaleAnnuncio').classList.remove('open');
    if (problemi.length) {
        console.error('salva annuncio:', problemi);
        toast(`⚠️ Annuncio salvato, ma ${problemi[0]}`, 4500);
    } else {
        toast(isNew ? '✓ Annuncio pubblicato' : '✓ Annuncio aggiornato');
    }
    if (selectedAnnuncio?.id === annuncioId) chiudiDettaglio();
    await carica();
    spin(false);
}

// Ridimensiona e invia la foto: le foto del telefono superano il limite di 4,5 MB
// delle funzioni Vercel e la risposta di errore non è JSON
async function uploadFoto(file, annuncioId, ordine) {
    const blob = await compressImage(file);
    const base64 = await fileToBase64(blob);
    const resp = await fetch('/api/vendita', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ file: base64, fileName: 'foto.jpg', annuncioId, email: userEmail, ordine })
    });
    const text = await resp.text();
    let result = {};
    try { result = JSON.parse(text); } catch {}
    if (!resp.ok) {
        if (resp.status === 413) throw new Error('immagine troppo grande');
        throw new Error(result.error || `errore server ${resp.status}`);
    }
    return result;
}

function compressImage(file) {
    return new Promise(resolve => {
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = () => {
            URL.revokeObjectURL(url);
            const MAX = 1600;
            let w = img.naturalWidth, h = img.naturalHeight;
            if (w > MAX || h > MAX) {
                const r = Math.min(MAX / w, MAX / h);
                w = Math.round(w * r); h = Math.round(h * r);
            }
            const canvas = document.createElement('canvas');
            canvas.width = w; canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            canvas.toBlob(blob => resolve(blob || file), 'image/jpeg', 0.82);
        };
        // Formato non decodificabile dal browser: si invia l'originale
        img.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
        img.src = url;
    });
}

function errMsg(e) {
    if (!e) return 'errore sconosciuto';
    if (typeof e === 'string') return e;
    return e.message || e.error_description || e.details || e.hint || e.code || 'errore sconosciuto';
}

function storagePathFromUrl(url) {
    try {
        const marker = '/vendita-foto/';
        const idx = url.indexOf(marker);
        return idx !== -1 ? url.slice(idx + marker.length) : null;
    } catch { return null; }
}

async function eliminaAnnuncio() {
    if (!editId || !confirm('Eliminare questo annuncio?')) return;
    spin(true);
    // Delete photos from storage
    const { data: foto } = await sb.from('vendita_foto').select('url').eq('annuncio_id', editId);
    for (const f of (foto || [])) {
        const p = storagePathFromUrl(f.url);
        if (p) await sb.storage.from('vendita-foto').remove([p]);
    }
    await sb.from('vendita_annunci').delete().eq('id', editId);
    document.getElementById('modaleAnnuncio').classList.remove('open');
    if (selectedAnnuncio?.id === editId) chiudiDettaglio();
    toast('Annuncio eliminato');
    await carica();
    spin(false);
}

// ── Condivisione esterna ──────────────────────────────────
async function condividiAnnuncio() {
    const a = selectedAnnuncio;
    if (!a) return;
    const url = `${location.origin}/annuncio/${a.id}`;
    const prezzo = a.prezzo != null ? `€ ${Number(a.prezzo).toFixed(2).replace('.', ',')}` : 'Prezzo libero';
    const testo = `${a.titolo} — ${prezzo}`;
    if (navigator.share) {
        try { await navigator.share({ title: a.titolo, text: testo, url }); return; }
        catch (e) { if (e.name === 'AbortError') return; }
    }
    try {
        await navigator.clipboard.writeText(`${testo}\n${url}`);
        toast('✓ Link copiato');
    } catch {
        prompt('Copia il link dell\'annuncio:', url);
    }
}

// ── Chat ──────────────────────────────────────────────────
// In vendita_chat ogni riga è un messaggio da email_mittente a email_venditore, che è il
// DESTINATARIO (il nome della colonna è storico): il venditore che risponde scrive all'acquirente.
function titoloAnnuncio(id) {
    return [...annunci, ...miei].find(a => a.id === id)?.titolo
        || conversazioni.find(c => c.annuncioId === id)?.titolo || 'Annuncio';
}

function apriChat(annuncioId, partner) {
    chatAnnuncioId = annuncioId;
    chatPartner = partner;
    document.getElementById('chatTitle').textContent = titoloAnnuncio(annuncioId);
    document.getElementById('chatSub').textContent = partner;
    renderQuickRow();
    apriChatComune(annuncioId, partner);
}

function renderQuickRow() {
    const row = document.getElementById('quickRow');
    const a = [...annunci, ...miei].find(x => x.id === chatAnnuncioId);
    const isBuyer = a && a.email_utente !== userEmail;
    const chips = [];
    if (isBuyer) {
        chips.push('È ancora disponibile?');
        const cons = a.consegna || 'ritiro';
        if (cons !== 'spedizione') chips.push('Vorrei ritirarlo a mano');
        if (cons !== 'ritiro') chips.push('Vorrei la spedizione: la organizzo su spediamo.it');
    } else if (a) {
        chips.push('Sì, è disponibile');
        const cons = a.consegna || 'ritiro';
        if (cons !== 'ritiro') chips.push(`Per la spedizione puoi calcolare il costo su ${SPEDIAMO_URL}`);
    }
    row.innerHTML = chips.map((c, i) => `<button class="quick-chip" data-i="${i}">${esc(c)}</button>`).join('');
    row.querySelectorAll('.quick-chip').forEach((b, i) => b.onclick = () => {
        document.getElementById('chatInput').value = chips[i];
        inviaMsg();
    });
    row.classList.toggle('on', chips.length > 0);
}

function filtroConversazione(partner) {
    return `and(email_mittente.eq.${userEmail},email_venditore.eq.${partner}),and(email_mittente.eq.${partner},email_venditore.eq.${userEmail})`;
}

async function apriChatComune(annuncioId, partner) {
    document.getElementById('chatMsgs').innerHTML = '';
    chatSeen = new Set(); chatLastId = 0;
    document.getElementById('chatScreen').classList.add('open');
    await loadMsgs(annuncioId, partner);

    if (chatRealtime) { await sb.removeChannel(chatRealtime); chatRealtime = null; }
    chatRealtime = sb.channel(`chat-${annuncioId}-${[userEmail, partner].sort().join('-')}`)
        .on('postgres_changes', {
            event: 'INSERT', schema: 'public', table: 'vendita_chat',
            filter: `annuncio_id=eq.${annuncioId}`
        }, payload => {
            const m = payload.new;
            if ((m.email_mittente === userEmail && m.email_venditore === partner) ||
                (m.email_mittente === partner && m.email_venditore === userEmail)) {
                if (appendMsg(m)) { scrollMsgs(); segnaLetti(); }
            }
        })
        .subscribe();

    // Rete di sicurezza se il realtime non è attivo sulla tabella
    clearInterval(chatPollTimer);
    chatPollTimer = setInterval(async () => {
        if (!chatAnnuncioId) return;
        const { data } = await sb.from('vendita_chat').select('*')
            .eq('annuncio_id', chatAnnuncioId).or(filtroConversazione(chatPartner))
            .gt('id', chatLastId).order('id', { ascending: true });
        let nuovi = false;
        (data || []).forEach(m => { if (appendMsg(m)) nuovi = true; });
        if (nuovi) { scrollMsgs(); segnaLetti(); }
    }, 5000);

    await segnaLetti();
}

async function segnaLetti() {
    if (!chatAnnuncioId) return;
    await sb.from('vendita_chat')
        .update({ letto: true })
        .eq('annuncio_id', chatAnnuncioId)
        .eq('email_mittente', chatPartner)
        .eq('email_venditore', userEmail)
        .eq('letto', false);
}

async function loadMsgs(annuncioId, partner) {
    const { data } = await sb.from('vendita_chat')
        .select('*')
        .eq('annuncio_id', annuncioId)
        .or(filtroConversazione(partner))
        .order('created_at', { ascending: true });

    document.getElementById('chatMsgs').innerHTML = '';
    if (!data?.length) {
        document.getElementById('chatMsgs').innerHTML = '<div class="no-chat" id="chatEmpty">Scrivi il primo messaggio 👋</div>';
    }
    (data || []).forEach(m => appendMsg(m));
    scrollMsgs();
}

// Ritorna false se il messaggio era già mostrato (arriva sia da realtime che da polling/invio)
function appendMsg(m) {
    if (m.id != null) {
        if (chatSeen.has(m.id)) return false;
        chatSeen.add(m.id);
        chatLastId = Math.max(chatLastId, m.id);
    }
    document.getElementById('chatEmpty')?.remove();
    const isMe = m.email_mittente === userEmail;
    const d = new Date(m.created_at);
    const oggi = d.toDateString() === new Date().toDateString();
    const time = (oggi ? '' : d.toLocaleDateString('it-IT', { day: '2-digit', month: '2-digit' }) + ' ')
        + d.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
    const el = document.createElement('div');
    el.className = `msg-wrap ${isMe ? 'me' : 'other'}`;
    el.innerHTML = `<div class="bubble">${linkify(esc(m.messaggio))}</div><div class="msg-time">${time}</div>`;
    document.getElementById('chatMsgs').appendChild(el);
    return true;
}

function linkify(html) {
    return html.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener" style="color:inherit;text-decoration:underline">$1</a>');
}

function scrollMsgs() {
    const el = document.getElementById('chatMsgs');
    el.scrollTop = el.scrollHeight;
}

async function inviaMsg() {
    const input = document.getElementById('chatInput');
    const testo = input.value.trim();
    if (!testo || !chatAnnuncioId || !chatPartner) return;
    input.value = '';
    input.style.height = 'auto';

    const { data, error } = await sb.from('vendita_chat').insert({
        annuncio_id: chatAnnuncioId,
        email_mittente: userEmail,
        email_venditore: chatPartner, // destinatario
        messaggio: testo,
        letto: false
    }).select().single();
    if (error) { toast('Errore invio: ' + errMsg(error)); input.value = testo; return; }
    if (appendMsg(data)) scrollMsgs();

    // Notifica push al destinatario (best effort)
    fetch('/api/vendita', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ azione: 'notifica-chat', messaggioId: data.id })
    }).catch(() => {});
}

async function chiudiChat() {
    document.getElementById('chatScreen').classList.remove('open');
    clearInterval(chatPollTimer); chatPollTimer = null;
    chatAnnuncioId = null;
    if (chatRealtime) { await sb.removeChannel(chatRealtime); chatRealtime = null; }
    if (selectedAnnuncio?.email_utente === userEmail) await loadConversazioni(selectedAnnuncio.id);
    if (currentTab === 'msg') await caricaMessaggi();
    aggiornaBadge();
}

// ── Messaggi (tutte le conversazioni, come venditore e come acquirente) ──
async function caricaMessaggi() {
    const { data, error } = await sb.from('vendita_chat')
        .select('*, vendita_annunci(id,titolo,email_utente,vendita_foto(url,ordine))')
        .or(`email_mittente.eq.${userEmail},email_venditore.eq.${userEmail}`)
        .order('created_at', { ascending: false })
        .limit(500);
    if (error) { toast('Errore: ' + errMsg(error)); return; }

    const map = new Map();
    for (const m of (data || [])) {
        const partner = m.email_mittente === userEmail ? m.email_venditore : m.email_mittente;
        if (partner === userEmail || !m.vendita_annunci) continue; // righe storiche senza destinatario
        const key = `${m.annuncio_id}|${partner}`;
        if (!map.has(key)) {
            const ann = m.vendita_annunci;
            const foto = (ann.vendita_foto || []).sort((x, y) => x.ordine - y.ordine)[0];
            map.set(key, {
                annuncioId: m.annuncio_id, partner, titolo: ann.titolo,
                foto: foto?.url, sonoVenditore: ann.email_utente === userEmail,
                ultimo: m, nonLetti: 0
            });
        }
        if (m.email_venditore === userEmail && m.email_mittente === partner && !m.letto) map.get(key).nonLetti++;
    }
    conversazioni = [...map.values()];
    if (currentTab === 'msg') renderMessaggi(document.getElementById('searchInput').value);
}

function renderMessaggi(q = '') {
    const grid = document.getElementById('listingsGrid');
    const low = q.toLowerCase();
    const list = conversazioni.filter(c => !q || c.titolo.toLowerCase().includes(low) || c.partner.toLowerCase().includes(low));
    if (!list.length) {
        grid.innerHTML = '<div class="empty-msg">💬 Nessuna conversazione — apri un annuncio e scrivi al venditore</div>';
        return;
    }
    grid.innerHTML = '<div class="msg-list">' + list.map((c, i) => {
        const d = new Date(c.ultimo.created_at);
        const quando = d.toDateString() === new Date().toDateString()
            ? d.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' })
            : d.toLocaleDateString('it-IT', { day: '2-digit', month: '2-digit' });
        const thumb = c.foto ? `<img class="msg-thumb" src="${esc(c.foto)}" alt="">` : '<div class="msg-thumb">🏷️</div>';
        const anteprima = (c.ultimo.email_mittente === userEmail ? 'Tu: ' : '') + c.ultimo.messaggio;
        return `<div class="conv-item" data-i="${conversazioni.indexOf(c)}" onclick="apriConversazione(this.dataset.i)">
            ${thumb}
            <div style="flex:1;min-width:0">
                <div class="conv-title">${esc(c.titolo)}</div>
                <div class="conv-email">${c.sonoVenditore ? '🛒 ' : '🏷️ '}${esc(c.partner)}</div>
                <div class="conv-preview" style="${c.nonLetti ? 'color:#111;font-weight:800' : ''}">${esc(anteprima)}</div>
            </div>
            <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">
                <div class="conv-time">${quando}</div>
                ${c.nonLetti ? `<span class="tab-badge on" style="margin:0">${c.nonLetti}</span>` : ''}
            </div>
        </div>`;
    }).join('') + '</div>';
}

function apriConversazione(i) {
    const c = conversazioni[i];
    if (c) apriChat(c.annuncioId, c.partner);
}

async function aggiornaBadge() {
    const { count } = await sb.from('vendita_chat')
        .select('id', { count: 'exact', head: true })
        .eq('email_venditore', userEmail)
        .neq('email_mittente', userEmail)
        .eq('letto', false);
    const b = document.getElementById('msgBadge');
    b.textContent = count > 99 ? '99+' : (count || '');
    b.classList.toggle('on', count > 0);
}

// ── Modal close on backdrop ───────────────────────────────
document.getElementById('modaleAnnuncio').addEventListener('click', e => {
    if (e.target === document.getElementById('modaleAnnuncio'))
        document.getElementById('modaleAnnuncio').classList.remove('open');
});

// ── Helpers ───────────────────────────────────────────────
function esc(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function ucFirst(s) { return s ? s[0].toUpperCase() + s.slice(1) : s; }

let toastTimer;
function toast(msg, ms = 2500) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), ms);
}

function spin(on) { document.getElementById('spinOv').classList.toggle('open', on); }

// ── Init ──────────────────────────────────────────────────
(async () => {
    await carica();
    const params = new URLSearchParams(location.search);
    const chatId = parseInt(params.get('chat')), con = params.get('con');
    if (chatId && con) {
        if (!annunci.some(a => a.id === chatId)) await caricaMiei();
        if (![...annunci, ...miei].some(a => a.id === chatId)) await caricaMessaggi();
        apriChat(chatId, con);
        return;
    }
    const linkId = parseInt(params.get('annuncio'));
    if (!linkId) return;
    if (!annunci.some(a => a.id === linkId)) await caricaMiei();
    if ([...annunci, ...miei].some(a => a.id === linkId)) apriDettaglio(linkId);
    else toast('Annuncio non disponibile');
})();

    function _fbApri() { document.getElementById('fbOverlay').classList.add('open'); document.getElementById('fbTesto').focus(); }
    function _fbChiudi() { document.getElementById('fbOverlay').classList.remove('open'); document.getElementById('fbTesto').value = ''; }
    async function _fbInvia() {
        const testo = document.getElementById('fbTesto').value.trim();
        if (!testo) return;
        const tipo = document.querySelector('input[name="fbTipo"]:checked').value;
        const email = (typeof userEmail !== 'undefined' && userEmail) ? userEmail : (localStorage.getItem('userEmail') || 'anonimo');
        const btn = document.getElementById('fbSendBtn');
        btn.disabled = true; btn.textContent = 'Invio…';
        try {
            const r = await fetch('/api/feedback', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ email, tipo, testo }) });
            if (r.ok) {
                _fbChiudi();
                if (typeof toast === 'function') toast('Feedback inviato, grazie! 🙏');
            }
        } catch(e) {}
        finally { btn.disabled = false; btn.textContent = 'Invia'; }
    }
</script>

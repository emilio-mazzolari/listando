<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Etichette — Listando</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-pwa-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Listando">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
    color-scheme: light;
    --accent:#4f46e5; --accent-bg:rgba(79,70,229,.08);
    --green:#0fba8d; --red:#ef4444;
    --grey:#e2e8f0; --grey-light:#f1f5f9;
    --dark:#0f172a; --bg:#f5f6f8; --white:#fff;
    --shadow:0 2px 8px rgba(0,0,0,.07);
}
*{box-sizing:border-box;}
html,body{overflow-x:hidden;max-width:100%;margin:0;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--dark);}

.page-header{position:sticky;top:0;z-index:100;background:var(--white);border-bottom:2px solid var(--grey-light);padding:14px 16px;padding-top:max(14px,env(safe-area-inset-top,14px));}
.header-row{display:flex;align-items:center;gap:10px;}
.btn-back{width:40px;height:40px;border-radius:12px;border:2.5px solid var(--grey);background:var(--white);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
.page-title{flex:1;font-size:18px;font-weight:900;}
.btn-new{padding:10px 16px;border-radius:12px;border:none;background:var(--accent);color:#fff;font-weight:800;font-size:14px;cursor:pointer;font-family:inherit;}

.content{padding:16px;max-width:560px;margin:0 auto;padding-bottom:max(100px,env(safe-area-inset-bottom,100px));}
.empty-msg{text-align:center;padding:60px 20px;color:#aaa;font-weight:700;font-size:14px;line-height:1.8;}

.label-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.label-card{background:var(--white);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;cursor:pointer;transition:transform .15s;}
.label-card:active{transform:scale(.97);}
.label-card-preview{width:100%;overflow:hidden;position:relative;background:#f8f9fa;}
.label-card-footer{padding:10px 12px;border-top:1px solid var(--grey-light);}
.label-card-name{font-weight:800;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.label-card-fmt{font-size:11px;color:#888;font-weight:700;margin-top:2px;}
.label-card-actions{display:flex;gap:5px;margin-top:8px;}
.btn-action{flex:1;padding:6px 2px;border-radius:9px;border:2px solid var(--grey);background:var(--white);font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--dark);}
.btn-action.print{background:var(--accent);color:#fff;border-color:var(--accent);}
.btn-action.del{border-color:#fcc;color:var(--red);}
.btn-action.foglio{background:#f0fdf4;color:#15803d;border-color:#bbf7d0;}
.btn-action.foglio.nel{background:#15803d;color:#fff;border-color:#15803d;}

#stampaBar{position:fixed;bottom:0;left:0;right:0;background:var(--accent);color:#fff;padding:14px 16px;padding-bottom:max(14px,env(safe-area-inset-bottom,14px));display:flex;align-items:center;gap:8px;z-index:150;transform:translateY(100%);transition:transform .25s;}
#stampaBar.visible{transform:translateY(0);}
.sbar-label{flex:1;font-weight:800;font-size:13px;}
.sbar-btn{padding:8px 12px;border-radius:10px;border:2px solid rgba(255,255,255,.35);background:transparent;color:#fff;font-weight:800;font-size:12px;cursor:pointer;font-family:inherit;white-space:nowrap;}
.sbar-btn.prim{background:rgba(255,255,255,.18);border-color:transparent;}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s;}
.modal-overlay.open{opacity:1;pointer-events:all;}
.modal-box{background:var(--white);border-radius:24px 24px 0 0;padding:20px 16px 10px;width:100%;max-width:560px;max-height:95vh;overflow-y:auto;}
.modal-handle{width:40px;height:4px;background:var(--grey);border-radius:2px;margin:0 auto 16px;}
.modal-title{font-size:20px;font-weight:900;margin-bottom:16px;}
.form-label{font-size:12px;font-weight:800;color:#888;text-transform:uppercase;letter-spacing:.5px;margin-bottom:7px;display:block;}
.form-input{width:100%;padding:12px 14px;border-radius:14px;border:2.5px solid var(--grey);font-size:15px;font-family:inherit;outline:none;margin-bottom:12px;background:var(--white);color:var(--dark);}
.form-input:focus{border-color:var(--accent);}
.btn-modal{width:100%;padding:15px;border-radius:16px;border:none;font-size:15px;font-weight:900;cursor:pointer;font-family:inherit;margin-top:6px;}

.preview-wrap{margin-bottom:16px;overflow:hidden;border-radius:14px;border:1.5px solid var(--grey-light);background:#f8f9fa;display:flex;justify-content:center;align-items:center;padding:14px;min-height:80px;}
.preview-container{position:relative;overflow:hidden;}

.stile-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px;}
.stile-btn{padding:7px 4px;border-radius:12px;border:2px solid var(--grey);background:var(--white);cursor:pointer;font-family:inherit;font-size:11px;font-weight:700;text-align:center;color:var(--dark);transition:all .15s;}
.stile-btn.active{border-color:var(--accent);background:var(--accent-bg);color:var(--accent);}
.stile-preview{height:34px;border-radius:6px;margin-bottom:5px;overflow:hidden;}

.color-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
.color-dot{width:34px;height:34px;border-radius:50%;border:3px solid transparent;cursor:pointer;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.2);}
.color-dot.active{border-color:var(--accent);transform:scale(1.18);}
.color-pickers{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap;}
.color-pickers label{font-size:12px;font-weight:700;color:#888;}
.color-pickers input[type=color]{width:40px;height:34px;border-radius:10px;border:2px solid var(--grey);cursor:pointer;padding:2px;}

/* Font picker */
.font-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px;}
.font-btn{padding:8px 4px;border-radius:12px;border:2px solid var(--grey);background:var(--white);cursor:pointer;font-family:inherit;text-align:center;color:var(--dark);transition:all .15s;}
.font-btn.active{border-color:var(--accent);background:var(--accent-bg);color:var(--accent);}
.font-sample{font-size:18px;font-weight:700;line-height:1.2;margin-bottom:3px;}
.font-name{font-size:10px;font-weight:700;color:#888;}

/* Align picker */
.align-row{display:flex;gap:8px;margin-bottom:14px;}
.align-btn{flex:1;padding:9px 4px;border-radius:12px;border:2px solid var(--grey);background:var(--white);cursor:pointer;font-family:inherit;font-size:18px;line-height:1;color:var(--dark);transition:all .15s;}
.align-btn.active{border-color:var(--accent);background:var(--accent-bg);}

.formato-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px;}
.formato-btn{padding:10px 8px;border-radius:12px;border:2px solid var(--grey);background:var(--white);cursor:pointer;font-family:inherit;text-align:center;color:var(--dark);transition:all .15s;}
.formato-btn.active{border-color:var(--accent);background:var(--accent-bg);color:var(--accent);}
.formato-label{font-size:13px;font-weight:800;}
.formato-desc{font-size:10px;color:#888;font-weight:600;margin-top:2px;}
.formato-vis{margin:0 auto 5px;border:2px solid currentColor;border-radius:3px;opacity:.55;}

.dim-row{display:flex;gap:10px;margin-bottom:14px;}
.dim-row>div{flex:1;}

.copie-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;background:var(--grey-light);border-radius:14px;padding:12px 14px;}
.copie-stepper{display:flex;align-items:center;gap:10px;}
.copie-btn{width:36px;height:36px;border-radius:10px;border:2px solid var(--grey);background:var(--white);font-size:20px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;}
.copie-val{font-size:22px;font-weight:900;min-width:32px;text-align:center;}

.margine-chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
.margine-chip{padding:7px 14px;border-radius:11px;border:2px solid var(--grey);background:var(--white);font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;color:var(--dark);transition:all .15s;}
.margine-chip.active{border-color:var(--accent);background:var(--accent-bg);color:var(--accent);}

/* Size chips */
.size-chips{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.size-chip{padding:8px 14px;border-radius:11px;border:2px solid var(--grey);background:var(--white);font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;color:var(--dark);transition:all .15s;}
.size-chip.active{border-color:var(--accent);background:var(--accent-bg);color:var(--accent);}

/* Bold/italic toggles */
.style-row{display:flex;gap:8px;margin-bottom:14px;}
.style-tog{flex:1;padding:10px 4px;border-radius:12px;border:2px solid var(--grey);background:var(--white);cursor:pointer;font-family:inherit;font-size:14px;font-weight:700;color:var(--dark);transition:all .15s;text-align:center;}
.style-tog.active{border-color:var(--accent);background:var(--accent-bg);color:var(--accent);}

/* Serie button */
.btn-serie{padding:10px 14px;border-radius:12px;border:2px solid var(--accent);background:var(--white);color:var(--accent);font-weight:800;font-size:14px;cursor:pointer;font-family:inherit;}

#anteprimaWrap{position:relative;overflow:hidden;margin:0 auto 16px;}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:12px 20px;border-radius:14px;font-weight:700;font-size:14px;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;max-width:90vw;text-align:center;}
.toast.show{opacity:1;}

#printLayer{display:none;}
@media print{
    @page{margin:10mm;}
    body>*{display:none!important;}
    #printLayer{display:block!important;}
    *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;}
}
</style>
</head>
<body>

<div class="page-header">
    <div class="header-row">
        <button class="btn-back" onclick="history.back()">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <div class="page-title">🏷️ Etichette</div>
        <button class="btn-serie" onclick="apriSerie()">⚡ Serie</button>
        <button class="btn-new" onclick="apriNuova()">+ Nuova</button>
    </div>
</div>

<div class="content">
    <div id="elenco"></div>
</div>

<div id="stampaBar">
    <div class="sbar-label" id="sbarLabel">0 etichette nel foglio</div>
    <button class="sbar-btn" onclick="svuotaFoglio()">🗑️ Svuota</button>
    <button class="sbar-btn prim" onclick="apriAnteprima()">👁️ Anteprima</button>
</div>

<!-- Modal crea/modifica -->
<div class="modal-overlay" id="modal" onclick="if(event.target===this)chiudi()">
  <div class="modal-box">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modalTitolo">Nuova etichetta</div>

    <div class="preview-wrap" id="previewWrap">
        <div class="preview-container" id="previewCont"><div id="previewInner"></div></div>
    </div>

    <label class="form-label">Titolo *</label>
    <input class="form-input" id="fTitolo" type="text" placeholder="es. Documenti fiscali" oninput="aggiornaPrev()">

    <label class="form-label">Sottotitolo</label>
    <input class="form-input" id="fSub" type="text" placeholder="es. Fatture, contratti, ricevute" oninput="aggiornaPrev()">

    <label class="form-label">Periodo / anno</label>
    <input class="form-input" id="fPeriodo" type="text" placeholder="es. 2020 — 2024" oninput="aggiornaPrev()">

    <label class="form-label">Icona</label>
    <div id="iconPicker" style="display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px"></div>

    <label class="form-label">Stile grafico</label>
    <div class="stile-grid" id="stilePicker"></div>

    <label class="form-label">Colore</label>
    <div class="color-grid" id="colorGrid"></div>
    <div class="color-pickers">
        <label>Sfondo</label><input type="color" id="cSfondo" oninput="onCustomColor()">
        <label>Testo</label><input type="color" id="cTesto" oninput="onCustomColor()">
        <label>Accento</label><input type="color" id="cAcc" oninput="onCustomColor()">
    </div>

    <label class="form-label">Font</label>
    <div class="font-grid" id="fontPicker"></div>

    <label class="form-label">Allineamento testo</label>
    <div class="align-row" id="alignPicker"></div>

    <label class="form-label">Dimensione testo</label>
    <div class="size-chips" id="sizeChips"></div>

    <label class="form-label">Stile testo</label>
    <div class="style-row">
        <button class="style-tog" id="togGrassetto" onclick="toggleGrassetto()"><b>G</b> Grassetto</button>
        <button class="style-tog" id="togCorsivo" onclick="toggleCorsivo()"><i>I</i> Corsivo</button>
    </div>

    <label class="form-label">Formato di stampa</label>
    <div class="formato-grid" id="formatGrid"></div>

    <label class="form-label">Dimensioni etichetta</label>
    <div class="dim-row">
        <div>
            <label class="form-label">Larghezza mm</label>
            <input class="form-input" id="fW" type="number" min="10" max="400" placeholder="190" oninput="onDimChange()" style="margin:0">
        </div>
        <div>
            <label class="form-label">Altezza mm</label>
            <input class="form-input" id="fH" type="number" min="10" max="400" placeholder="136" oninput="onDimChange()" style="margin:0">
        </div>
    </div>

    <label class="form-label">Copie da stampare</label>
    <div class="copie-row">
        <span style="font-weight:700;font-size:14px">N° copie per stampa</span>
        <div class="copie-stepper">
            <button class="copie-btn" onclick="cambiaCopie(-1)">−</button>
            <div class="copie-val" id="copieVal">1</div>
            <button class="copie-btn" onclick="cambiaCopie(1)">+</button>
        </div>
    </div>

    <button class="btn-modal" style="background:var(--accent);color:#fff" onclick="salva()">SALVA</button>
    <button class="btn-modal" style="background:#e8f5e9;color:var(--green)" onclick="stampaOra()">🖨️ STAMPA ORA</button>
    <button class="btn-modal" id="btnDuplica" style="display:none;background:var(--grey-light);color:var(--dark)" onclick="duplicaAttuale()">📋 DUPLICA</button>
    <button class="btn-modal" id="btnDel" style="display:none;background:#fff0f0;color:var(--red);border:2px solid #fcc" onclick="eliminaAttuale()">ELIMINA</button>
    <button class="btn-modal" style="background:transparent;color:#aaa" onclick="chiudi()">Annulla</button>
  </div>
</div>

<!-- Modal anteprima di stampa -->
<div class="modal-overlay" id="modalAnteprima" onclick="if(event.target===this)chiudiAnteprima()">
  <div class="modal-box">
    <div class="modal-handle"></div>
    <div class="modal-title">👁️ Anteprima di stampa</div>

    <label class="form-label">Margini pagina</label>
    <div class="margine-chips" id="margineChips"></div>

    <label class="form-label">Layout foglio A4</label>
    <div id="anteprimaWrap">
        <div id="anteprimaPage" style="position:absolute;top:0;left:0;transform-origin:top left"></div>
    </div>

    <button class="btn-modal" style="background:var(--accent);color:#fff;margin-top:16px" onclick="eseguiStampaFoglio()">🖨️ STAMPA FOGLIO</button>
    <button class="btn-modal" style="background:transparent;color:#aaa" onclick="chiudiAnteprima()">Chiudi</button>
  </div>
</div>

<!-- Modal Serie -->
<div class="modal-overlay" id="modalSerie" onclick="if(event.target===this)chiudiSerie()">
  <div class="modal-box">
    <div class="modal-handle"></div>
    <div class="modal-title">⚡ Stampa serie</div>

    <label class="form-label">Titoli (uno per riga) *</label>
    <textarea class="form-input" id="seTitoli" rows="8" placeholder="Documento 1&#10;Documento 2&#10;Documento 3&#10;..." oninput="aggiornaPrevSerie()" style="resize:vertical;line-height:1.6"></textarea>

    <label class="form-label">Sottotitolo comune</label>
    <input class="form-input" id="seComSub" type="text" placeholder="Uguale per tutte" oninput="aggiornaPrevSerie()">

    <label class="form-label">Periodo comune</label>
    <input class="form-input" id="seComPer" type="text" placeholder="es. 2024" oninput="aggiornaPrevSerie()">

    <label class="form-label">Icona</label>
    <div id="seIconPicker" style="display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px"></div>

    <label class="form-label">Stile grafico</label>
    <div class="stile-grid" id="seStilePicker"></div>

    <label class="form-label">Colore</label>
    <div class="color-grid" id="seColorGrid"></div>
    <div class="color-pickers">
        <label>Sfondo</label><input type="color" id="seCsfondo" oninput="seOnCustomColor()">
        <label>Testo</label><input type="color" id="seCTesto" oninput="seOnCustomColor()">
        <label>Accento</label><input type="color" id="seCacc" oninput="seOnCustomColor()">
    </div>

    <label class="form-label">Font</label>
    <div class="font-grid" id="seFontPicker"></div>

    <label class="form-label">Dimensione testo</label>
    <div class="size-chips" id="seSizeChips"></div>

    <label class="form-label">Stile testo</label>
    <div class="style-row">
        <button class="style-tog" id="seTogGrassetto" onclick="seToggleGrassetto()"><b>G</b> Grassetto</button>
        <button class="style-tog" id="seTogCorsivo" onclick="seToggleCorsivo()"><i>I</i> Corsivo</button>
    </div>

    <label class="form-label">Allineamento testo</label>
    <div class="align-row" id="seAlignPicker"></div>

    <label class="form-label">Formato di stampa</label>
    <div class="formato-grid" id="seFormatGrid"></div>

    <label class="form-label">Dimensioni etichetta</label>
    <div class="dim-row">
        <div>
            <label class="form-label">Larghezza mm</label>
            <input class="form-input" id="seW" type="number" min="10" max="400" placeholder="61" oninput="seOnDimChange()" style="margin:0">
        </div>
        <div>
            <label class="form-label">Altezza mm</label>
            <input class="form-input" id="seH" type="number" min="10" max="400" placeholder="67" oninput="seOnDimChange()" style="margin:0">
        </div>
    </div>

    <div id="sePrevInfo" style="text-align:center;font-weight:700;font-size:13px;color:#888;margin-bottom:12px"></div>

    <label class="form-label">Anteprima foglio A4 (pagina 1)</label>
    <div id="sePrevWrap" style="margin:0 auto 16px;border:1.5px solid var(--grey);border-radius:4px;background:#fff;position:relative;overflow:hidden">
        <div id="sePrevPage" style="transform-origin:top left"></div>
    </div>

    <button class="btn-modal" style="background:var(--accent);color:#fff" onclick="stampaSerie()">🖨️ STAMPA SERIE</button>
    <button class="btn-modal" style="background:transparent;color:#aaa" onclick="chiudiSerie()">Annulla</button>
  </div>
</div>

<div id="printLayer"></div>
<div class="toast" id="toast"></div>

// ── Init ───────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', async () => {

async function carica() {
    const { data } = await sb.from('etichette').select('*').eq('email_utente', userEmail).order('created_at', { ascending: false });
    items = data || [];
    renderElenco();
    aggiornaBarra();
}

// ── Render list ────────────────────────────────────────────────────
function renderElenco() {
    const el = document.getElementById('elenco');
    if (!items.length) {
        el.innerHTML = '<div class="empty-msg">🏷️<br>Nessuna etichetta.<br>Creane una con <b>+ Nuova</b>.</div>';
        return;
    }
    el.innerHTML = `<div class="label-grid">${items.map(e => {
        const fmt = FORMATI.find(f => f.id === e.formato) || FORMATI[1];
        const W = e.larghezza_mm || fmt.w || 190;
        const H = e.altezza_mm || fmt.h || 136;
        const CARD = 180;
        const sc = CARD / (W * 3.779);
        const ph = Math.round(H * 3.779 * sc);
        const inQ = stampaQueue.includes(e.id);
        return `<div class="label-card" onclick="apriEdit(${e.id})">
            <div class="label-card-preview" style="height:${ph}px">
                <div style="transform:scale(${sc.toFixed(4)});transform-origin:top left;position:absolute">
                    ${labelHtml(e, W, H)}
                </div>
            </div>
            <div class="label-card-footer">
                <div class="label-card-name">${esc(e.titolo || 'Senza titolo')}</div>
                <div class="label-card-fmt">${fmt.label} · ${W}×${H}mm</div>
                <div class="label-card-actions">
                    <button class="btn-action foglio${inQ?' nel':''}" onclick="event.stopPropagation();aggiungiAlFoglio(${e.id})">${inQ?'✓ Nel foglio':'⊕ Foglio'}</button>
                    <button class="btn-action print" onclick="event.stopPropagation();stampaById(${e.id})">🖨️ Stampa</button>
                    <button class="btn-action del" onclick="event.stopPropagation();del(${e.id})">✕</button>
                </div>
            </div>
        </div>`;
    }).join('')}</div>`;
}

// ── Label HTML builder ─────────────────────────────────────────────
function labelHtml(e, W, H) {
    const stile = e.stile || 'pieno';
    const sf = e.colore_sfondo || '#0f172a';
    const te = e.colore_testo  || '#f8fafc';
    const ac = e.colore_accento|| '#818cf8';
    const ic = e.icona || '';
    const ti = esc(e.titolo || '');
    const su = esc(e.sottotitolo || '');
    const pe = esc(e.periodo || '');
    const ff = FONTS[e.font || 'sans']?.css || FONTS.sans.css;
    const al = e.allineamento === 'sinistra' ? 'left' : e.allineamento === 'destra' ? 'right' : 'center';
    const sc = DIM_SCALE[e.dim_scala||'m']||1.0;
    const fw = e.grassetto===false?'400':'900';
    const fst = e.corsivo?'italic':'normal';
    const r = `border-radius:4px;`;
    const mn = Math.min(W, H);
    const pad  = `${(mn * 0.07).toFixed(1)}mm`;
    const gap  = `${(mn * 0.04).toFixed(1)}mm`;
    const fIco = `${Math.min(mn * 0.16 * sc, 28).toFixed(1)}mm`;
    const fTit = `${Math.min(mn * 0.1  * sc, 18).toFixed(1)}mm`;
    const fSub = `${Math.min(mn * 0.068* sc, 12).toFixed(1)}mm`;
    const fPer = `${Math.min(mn * 0.058* sc, 10).toFixed(1)}mm`;
    const base = `width:${W}mm;height:${H}mm;overflow:hidden;position:relative;${r}font-family:${ff};font-style:${fst};`;

    if (stile === 'pieno') {
        const flex_al = al === 'left' ? 'flex-start' : al === 'right' ? 'flex-end' : 'center';
        return `<div style="${base}background:${sf};color:${te};display:flex;flex-direction:column;align-items:${flex_al};justify-content:center;padding:${pad};text-align:${al};gap:${gap}">
            ${ic?`<div style="font-size:${fIco};line-height:1">${ic}</div>`:''}
            <div style="font-size:${fTit};font-weight:${fw};line-height:1.15;word-break:break-word">${ti}</div>
            ${su?`<div style="font-size:${fSub};font-weight:600;opacity:.82;line-height:1.3">${su}</div>`:''}
            ${pe?`<div style="font-size:${fPer};font-weight:700;opacity:.6;padding:${(mn*.02).toFixed(1)}mm ${(mn*.04).toFixed(1)}mm;border:1px solid ${te}55;border-radius:3mm;margin-top:${(mn*.01).toFixed(1)}mm">${pe}</div>`:''}
        </div>`;
    }
    if (stile === 'banda') {
        const bandH = (H * 0.38).toFixed(1);
        return `<div style="${base}background:#fff;border:1.5px solid ${sf}55;">
            <div style="width:100%;height:${bandH}mm;background:${sf};display:flex;align-items:center;padding:${pad};gap:${(mn*.04).toFixed(1)}mm">
                ${ic?`<div style="font-size:${fIco};line-height:1;flex-shrink:0">${ic}</div>`:''}
                <div style="font-size:${fTit};font-weight:${fw};color:${te};line-height:1.1;overflow:hidden;text-align:${al};flex:1">${ti}</div>
            </div>
            <div style="padding:${pad};display:flex;flex-direction:column;justify-content:center;gap:${gap};text-align:${al}">
                ${su?`<div style="font-size:${fSub};font-weight:700;color:#334155;line-height:1.35">${su}</div>`:''}
                ${pe?`<div style="font-size:${fPer};font-weight:700;color:#fff;background:${sf};padding:${(mn*.02).toFixed(1)}mm ${(mn*.04).toFixed(1)}mm;border-radius:2mm;display:inline-block">${pe}</div>`:''}
            </div>
        </div>`;
    }
    if (stile === 'bordo') {
        const bw = Math.max((mn * 0.025).toFixed(1), 2);
        const flex_al = al === 'left' ? 'flex-start' : al === 'right' ? 'flex-end' : 'center';
        return `<div style="${base}background:#fff;border:${bw}mm solid ${sf};display:flex;flex-direction:column;align-items:${flex_al};justify-content:center;padding:${pad};text-align:${al};gap:${gap}">
            ${ic?`<div style="font-size:${fIco};line-height:1;color:${sf}">${ic}</div>`:''}
            <div style="width:30%;height:1.5px;background:${sf};margin-bottom:${(mn*.01).toFixed(1)}mm"></div>
            <div style="font-size:${fTit};font-weight:${fw};color:#0f172a;line-height:1.15;word-break:break-word">${ti}</div>
            ${su?`<div style="font-size:${fSub};font-weight:600;color:#475569;line-height:1.3">${su}</div>`:''}
            ${pe?`<div style="font-size:${fPer};font-weight:700;color:#fff;background:${sf};padding:${(mn*.025).toFixed(1)}mm ${(mn*.05).toFixed(1)}mm;border-radius:3mm;margin-top:${(mn*.01).toFixed(1)}mm">${pe}</div>`:''}
            <div style="width:30%;height:1.5px;background:${sf};margin-top:${(mn*.01).toFixed(1)}mm"></div>
        </div>`;
    }
    if (stile === 'barra') {
        const bw = (W * 0.11).toFixed(1);
        return `<div style="${base}background:#fff;border:1px solid ${sf}44;display:flex;">
            <div style="width:${bw}mm;background:${sf};flex-shrink:0;display:flex;align-items:center;justify-content:center;">
                ${ic?`<div style="font-size:${Math.min(parseFloat(bw)*0.65,14).toFixed(1)}mm;writing-mode:vertical-rl;transform:rotate(180deg)">${ic}</div>`:''}
            </div>
            <div style="flex:1;padding:${pad};display:flex;flex-direction:column;justify-content:center;gap:${gap};text-align:${al}">
                <div style="font-size:${fTit};font-weight:${fw};color:#0f172a;line-height:1.15;word-break:break-word">${ti}</div>
                ${su?`<div style="font-size:${fSub};font-weight:600;color:#475569;line-height:1.3">${su}</div>`:''}
                ${pe?`<div style="font-size:${fPer};font-weight:700;color:${sf};border-top:1.5px solid ${sf}44;padding-top:${(mn*.02).toFixed(1)}mm;margin-top:${(mn*.01).toFixed(1)}mm">${pe}</div>`:''}
            </div>
        </div>`;
    }
    return `<div style="${base}background:${sf};color:${te};display:flex;align-items:center;justify-content:center;padding:${pad};font-size:${fTit};font-weight:${fw};text-align:${al}">${ti}</div>`;
}

// ── Preview live ───────────────────────────────────────────────────
function aggiornaPrev() {
    const W = parseFloat(document.getElementById('fW').value) || 190;
    const H = parseFloat(document.getElementById('fH').value) || 136;
    const e = {
        titolo: document.getElementById('fTitolo').value,
        sottotitolo: document.getElementById('fSub').value,
        periodo: document.getElementById('fPeriodo').value,
        icona: st.icona, stile: st.stile, font: st.font, allineamento: st.allineamento,
        grassetto: st.grassetto, corsivo: st.corsivo, dim_scala: st.dim_scala,
        colore_sfondo: document.getElementById('cSfondo').value,
        colore_testo: document.getElementById('cTesto').value,
        colore_accento: document.getElementById('cAcc').value,
    };
    const PREV = 288;
    const sc = PREV / (W * 3.779);
    const ph = Math.round(H * 3.779 * sc);
    document.getElementById('previewCont').style.width = PREV + 'px';
    document.getElementById('previewCont').style.height = ph + 'px';
    document.getElementById('previewWrap').style.minHeight = (ph + 28) + 'px';
    const inner = document.getElementById('previewInner');
    inner.style.cssText = `transform:scale(${sc.toFixed(4)});transform-origin:top left;position:absolute`;
    inner.innerHTML = labelHtml(e, W, H);
}

function buildIconPicker() {
    const nessuna = `<button onclick="setIcona('')" id="ic_none" style="font-size:11px;font-weight:800;color:#888;padding:3px;border:2.5px solid transparent;border-radius:9px;background:var(--grey-light);cursor:pointer;width:40px;height:40px;line-height:1;transition:all .1s">Nessuna</button>`;
    document.getElementById('iconPicker').innerHTML = nessuna + ICONS.map(ic =>
        `<button onclick="setIcona('${encodeURIComponent(ic)}')" id="ic_${encodeURIComponent(ic)}" style="font-size:22px;padding:3px;border:2.5px solid transparent;border-radius:9px;background:var(--grey-light);cursor:pointer;width:40px;height:40px;line-height:1;transition:all .1s">${ic}</button>`
    ).join('');
}
function setIcona(enc) {
    const ic = enc ? decodeURIComponent(enc) : '';
    st.icona = ic;
    document.querySelectorAll('[id^="ic_"]').forEach(b => { b.style.borderColor='transparent'; b.style.background='var(--grey-light)'; });
    const b = enc ? document.getElementById('ic_'+enc) : document.getElementById('ic_none');
    if (b) { b.style.borderColor='var(--accent)'; b.style.background='var(--accent-bg)'; }
    aggiornaPrev();
}

function buildStilePicker() {
    document.getElementById('stilePicker').innerHTML = STILI.map(s =>
        `<button class="stile-btn" id="stile_${s.id}" onclick="setStile('${s.id}')">
            <div class="stile-preview" id="stilePrev_${s.id}"></div>
            <div>${s.label}</div>
        </button>`
    ).join('');
    STILI.forEach(s => aggiornaStilePreview(s.id));
}
function aggiornaStilePreview(id) {
    const sf = st.sfondo; const el = document.getElementById('stilePrev_'+id);
    if (!el) return;
    if (id==='pieno') el.innerHTML=`<div style="width:100%;height:100%;background:${sf};border-radius:4px"></div>`;
    else if (id==='banda') el.innerHTML=`<div style="width:100%;height:100%;background:#fff;border-radius:4px;border:1px solid #e0e0e0;overflow:hidden"><div style="height:40%;background:${sf}"></div></div>`;
    else if (id==='bordo') el.innerHTML=`<div style="width:100%;height:100%;background:#fff;border-radius:4px;border:3px solid ${sf}"></div>`;
    else if (id==='barra') el.innerHTML=`<div style="width:100%;height:100%;background:#fff;border-radius:4px;border:1px solid #e0e0e0;overflow:hidden;display:flex"><div style="width:18%;background:${sf}"></div></div>`;

function setStile(id) {
    st.stile = id;
    document.querySelectorAll('.stile-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('stile_'+id)?.classList.add('active');

function buildColorGrid() {
    document.getElementById('colorGrid').innerHTML = COLORI.map((c,i) =>
        `<div class="color-dot" style="background:${c.s}" title="${c.name}" id="cd_${i}" onclick="setColore(${i})"></div>`
    ).join('');
}
function setColore(i) {
    const c = COLORI[i];
    st.sfondo=c.s; st.testo=c.t; st.acc=c.a;

function onCustomColor() {
    st.sfondo=document.getElementById('cSfondo').value;

function cambiaCopie(d) {
    nCopie = Math.max(1, Math.min(20, nCopie + d));
    document.getElementById('copieVal').textContent = nCopie;
}

// ── Stampa queue ───────────────────────────────────────────────────
function aggiungiAlFoglio(id) {
    const idx = stampaQueue.indexOf(id);
    if (idx === -1) stampaQueue.push(id);
    else stampaQueue.splice(idx, 1);
    aggiornaBarra();
    renderElenco();
}
function svuotaFoglio() {
    stampaQueue = [];
    aggiornaBarra();
    renderElenco();
}
function aggiornaBarra() {
    const n = stampaQueue.reduce((acc, id) => {
        const e = items.find(x => x.id === id);
        return acc + (e ? (e.copie || 1) : 0);
    }, 0);
    const count = stampaQueue.length;
    document.getElementById('sbarLabel').textContent = `${count} etichett${count===1?'a':'e'} · ${n} cop${n===1?'ia':'ie'} nel foglio`;
    document.getElementById('stampaBar').classList.toggle('visible', count > 0);
}

// ── Anteprima di stampa ────────────────────────────────────────────
function apriAnteprima() {
    if (!stampaQueue.length) { toast('Aggiungi etichette al foglio prima'); return; }
    renderAnteprima();
    document.getElementById('modalAnteprima').classList.add('open');
}
function chiudiAnteprima() { document.getElementById('modalAnteprima').classList.remove('open'); }
function renderAnteprima() {
    const PX = 3.779;
    const pgWpx = 210 * PX, pgHpx = 297 * PX;
    const marginPx = marginiMm * PX;
    let labelsHtml = '';
    for (const id of stampaQueue) {
        const e = items.find(x => x.id === id); if (!e) continue;
        const fmt = FORMATI.find(f => f.id === e.formato) || FORMATI[1];
        const W = e.larghezza_mm || fmt.w || 190;
        const H = e.altezza_mm || fmt.h || 136;
        const copies = e.copie || 1;
        for (let i = 0; i < copies; i++) labelsHtml += `<div style="flex-shrink:0;break-inside:avoid">${labelHtml(e, W, H)}</div>`;
    }
    const contentW = pgWpx - 2 * marginPx, contentH = pgHpx - 2 * marginPx;
    const pageHtml = `<div style="width:${pgWpx.toFixed(1)}px;height:${pgHpx.toFixed(1)}px;background:#fff;padding:${marginPx.toFixed(1)}px;box-sizing:border-box;box-shadow:0 3px 12px rgba(0,0,0,.18)"><div style="width:${contentW.toFixed(1)}px;height:${contentH.toFixed(1)}px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:3mm;overflow:hidden">${labelsHtml}</div></div>`;
    const targetW = Math.min(288, window.innerWidth - 64);
    const scale = targetW / pgWpx;
    const scaledH = Math.round(pgHpx * scale);
    const page = document.getElementById('anteprimaPage');
    page.innerHTML = pageHtml;
    page.style.transform = `scale(${scale.toFixed(4)})`;
    document.getElementById('anteprimaWrap').style.cssText = `width:${targetW}px;height:${scaledH}px;position:relative;overflow:hidden;margin:0 auto 16px;border:1.5px solid var(--grey);border-radius:4px;background:#fff`;
}

// ── Modal open/close ───────────────────────────────────────────────

    document.getElementById('btnDuplica').style.display = 'none';

    document.getElementById('fTitolo').value = '';
    document.getElementById('fSub').value = '';
    document.getElementById('fPeriodo').value = '';
    st = { icona:'📦', stile:'pieno', sfondo:'#0f172a', testo:'#f8fafc', acc:'#818cf8', formato:'a4_2', font:'sans', allineamento:'centro', grassetto:true, corsivo:false, dim_scala:'m' };
    popolaForm();
    document.getElementById('modal').classList.add('open');
    setTimeout(() => document.getElementById('fTitolo').focus(), 300);
}
function apriEdit(id) {
    const e = items.find(x => x.id === id); if (!e) return;
    editId = id; nCopie = e.copie || 1;
    document.getElementById('modalTitolo').textContent = 'Modifica etichetta';

    st = {

}
function popolaForm() {
    document.getElementById('cSfondo').value = st.sfondo;
    document.getElementById('cTesto').value = st.testo;
    document.getElementById('cAcc').value = st.acc;
    setIcona(st.icona ? encodeURIComponent(st.icona) : '');
    STILI.forEach(s => aggiornaStilePreview(s.id));
    setStile(st.stile);
    sincColorGrid(st.sfondo);
    setFont(st.font);
    setAllineamento(st.allineamento);
    setSizeScale(st.dim_scala||'m');
    document.getElementById('togGrassetto')?.classList.toggle('active', st.grassetto!==false);
    document.getElementById('togCorsivo')?.classList.toggle('active', !!st.corsivo);
    buildFormatGrid();

}
function chiudi() { document.getElementById('modal').classList.remove('open'); }

// ── CRUD ───────────────────────────────────────────────────────────
async function salva() {
    const titolo = document.getElementById('fTitolo').value.trim();
    if (!titolo) { toast('Inserisci un titolo'); return; }
    const W = parseFloat(document.getElementById('fW').value) || 190;
    const H = parseFloat(document.getElementById('fH').value) || 136;
    const row = {
        email_utente: userEmail, titolo,
        sottotitolo: document.getElementById('fSub').value.trim()||null,
        periodo: document.getElementById('fPeriodo').value.trim()||null,
        icona: st.icona, stile: st.stile,
        colore_sfondo: st.sfondo, colore_testo: st.testo, colore_accento: st.acc,
        formato: st.formato, larghezza_mm: W, altezza_mm: H, copie: nCopie,
        font: st.font, allineamento: st.allineamento,
        grassetto: st.grassetto, corsivo: st.corsivo, dim_scala: st.dim_scala,
    };
    if (editId) await sb.from('etichette').update(row).eq('id', editId);
    else await sb.from('etichette').insert(row);
    chiudi(); toast('✓ Salvata'); await carica();
}
async function del(id) {
    if (!confirm('Eliminare?')) return;
    await sb.from('etichette').delete().eq('id', id);
    toast('Eliminata'); await carica();
}
async function eliminaAttuale() { if (editId) { chiudi(); await del(editId); } }
async function copia(id) {
    const e = items.find(x => x.id === id); if (!e) return;
    const { id:_, created_at:__, ...rest } = e;
    await sb.from('etichette').insert({ ...rest, titolo: (rest.titolo||'')+ ' (copia)' });
    toast('✓ Duplicata'); await carica();
}
async function duplicaAttuale() { if (editId) { chiudi(); await copia(editId); } }

// ── Stampa ─────────────────────────────────────────────────────────
function stampaById(id) { const e = items.find(x => x.id === id); if (e) eseguiStampa(e); }
function stampaOra() {
    const W = parseFloat(document.getElementById('fW').value) || 190;
    const H = parseFloat(document.getElementById('fH').value) || 136;
    eseguiStampa({
        titolo: document.getElementById('fTitolo').value,
        sottotitolo: document.getElementById('fSub').value,
        periodo: document.getElementById('fPeriodo').value,
        icona: st.icona, stile: st.stile, font: st.font, allineamento: st.allineamento,
        grassetto: st.grassetto, corsivo: st.corsivo, dim_scala: st.dim_scala,
        colore_sfondo: document.getElementById('cSfondo').value,
        colore_testo: document.getElementById('cTesto').value,
        colore_accento: document.getElementById('cAcc').value,
        formato: st.formato, larghezza_mm: W, altezza_mm: H, copie: nCopie,
    });
}
function eseguiStampa(e) {
    const fmt = FORMATI.find(f => f.id === e.formato) || FORMATI[1];
    const W = e.larghezza_mm || fmt.w || 190;
    const H = e.altezza_mm  || fmt.h || 136;
    const tot = e.copie || 1;
    const isLand = fmt.land;
    let cols = fmt.cols || 1, rows = fmt.rows || 1;
    if (fmt.id === 'custom') {
        const pgW = isLand ? 277 : 190, pgH = isLand ? 190 : 277;
        cols = Math.max(1, Math.floor((pgW + 3) / (W + 3)));
        rows = Math.max(1, Math.floor((pgH + 3) / (H + 3)));
    }
    const perPag = cols * rows;
    const nPag = Math.ceil(tot / perPag);
    let pagesHtml = '', count = 0;
    for (let pg = 0; pg < nPag; pg++) {
        let grid = '';
        for (let i = 0; i < perPag && count < tot; i++, count++) grid += labelHtml(e, W, H);
        pagesHtml += `<div style="display:grid;grid-template-columns:repeat(${cols},${W}mm);gap:3mm;page-break-after:${pg<nPag-1?'always':'auto'};align-content:start">${grid}</div>`;
    }
    _setPrintStyle(`@media print{@page{size:A4 ${isLand?'landscape':'portrait'};margin:${marginiMm}mm;}}`);
    document.getElementById('printLayer').innerHTML = pagesHtml;
    requestAnimationFrame(() => window.print());
}
function eseguiStampaFoglio() {
    if (!stampaQueue.length) return;
    let labelsHtml = '';
    for (const id of stampaQueue) {
        const e = items.find(x => x.id === id); if (!e) continue;
        const fmt = FORMATI.find(f => f.id === e.formato) || FORMATI[1];
        const W = e.larghezza_mm || fmt.w || 190;
        const H = e.altezza_mm || fmt.h || 136;
        const copies = e.copie || 1;
        for (let i = 0; i < copies; i++) labelsHtml += `<div style="flex-shrink:0;break-inside:avoid">${labelHtml(e, W, H)}</div>`;
    }
    _setPrintStyle(`@media print{@page{size:A4 portrait;margin:${marginiMm}mm;}}`);
    document.getElementById('printLayer').innerHTML = `<div style="display:flex;flex-wrap:wrap;align-content:flex-start;gap:3mm">${labelsHtml}</div>`;
    chiudiAnteprima();
    requestAnimationFrame(() => window.print());
}
function _setPrintStyle(css) {
    let el = document.getElementById('_dynPrint');
    if (!el) { el = document.createElement('style'); el.id='_dynPrint'; document.head.appendChild(el); }
    el.textContent = css;
}

// ── Serie ──────────────────────────────────────────────────────────
function apriSerie() {
    stS = { ...st };
    if (!stS.dim_scala) stS.dim_scala = 'm';
    if (stS.grassetto === undefined) stS.grassetto = true;
    buildSeIconPicker();
    buildSeStilePicker();
    buildSeColorGrid();
    buildSeFontPicker();
    buildSeSizeChips();
    buildSeAlignPicker();
    buildSeFormatGrid();

    document.getElementById('seComSub').value = '';
    document.getElementById('seComPer').value = '';

    aggiornaPrevSerie();
    document.getElementById('modalSerie').classList.add('open');
}
function chiudiSerie() { document.getElementById('modalSerie').classList.remove('open'); }

function sePopolaForm() {
    document.getElementById('seCsfondo').value = stS.sfondo;
    document.getElementById('seCTesto').value = stS.testo;
    document.getElementById('seCacc').value = stS.acc;
    seSetIcona(stS.icona ? encodeURIComponent(stS.icona) : '');

    seSincColorGrid(stS.sfondo);

    document.getElementById('seTogCorsivo')?.classList.toggle('active', !!stS.corsivo);

}

function buildSeIconPicker() {
    const nessuna = `<button onclick="seSetIcona('')" id="seic_none" style="font-size:11px;font-weight:800;color:#888;padding:3px;border:2.5px solid transparent;border-radius:9px;background:var(--grey-light);cursor:pointer;width:40px;height:40px;line-height:1;transition:all .1s">Nessuna</button>`;
    document.getElementById('seIconPicker').innerHTML = nessuna + ICONS.map(ic =>
        `<button onclick="seSetIcona('${encodeURIComponent(ic)}')" id="seic_${encodeURIComponent(ic)}" style="font-size:22px;padding:3px;border:2.5px solid transparent;border-radius:9px;background:var(--grey-light);cursor:pointer;width:40px;height:40px;line-height:1;transition:all .1s">${ic}</button>`
    ).join('');
}
function seSetIcona(enc) {
    const ic = enc ? decodeURIComponent(enc) : '';
    stS.icona = ic;
    document.querySelectorAll('[id^="seic_"]').forEach(b => { b.style.borderColor='transparent'; b.style.background='var(--grey-light)'; });
    const b = enc ? document.getElementById('seic_'+enc) : document.getElementById('seic_none');
    if (b) { b.style.borderColor='var(--accent)'; b.style.background='var(--accent-bg)'; }
    aggiornaPrevSerie();
}
function buildSeStilePicker() {
    document.getElementById('seStilePicker').innerHTML = STILI.map(s =>
        `<button class="stile-btn" id="sestile_${s.id}" onclick="seSetStile('${s.id}')">
            <div class="stile-preview" id="sestileprev_${s.id}"></div>
            <div>${s.label}</div>
        </button>`
    ).join('');
    STILI.forEach(s => seAggiornaStilePreview(s.id));
}
function seAggiornaStilePreview(id) {
    const sf = stS.sfondo; const el = document.getElementById('sestileprev_'+id);
    if (!el) return;
    if (id==='pieno') el.innerHTML=`<div style="width:100%;height:100%;background:${sf};border-radius:4px"></div>`;
    else if (id==='banda') el.innerHTML=`<div style="width:100%;height:100%;background:#fff;border-radius:4px;border:1px solid #e0e0e0;overflow:hidden"><div style="height:40%;background:${sf}"></div></div>`;
    else if (id==='bordo') el.innerHTML=`<div style="width:100%;height:100%;background:#fff;border-radius:4px;border:3px solid ${sf}"></div>`;
    else if (id==='barra') el.innerHTML=`<div style="width:100%;height:100%;background:#fff;border-radius:4px;border:1px solid #e0e0e0;overflow:hidden;display:flex"><div style="width:18%;background:${sf}"></div></div>`;
}
function seSetStile(id) {
    stS.stile = id;
    document.querySelectorAll('[id^="sestile_"]').forEach(b => b.classList.remove('active'));
    document.getElementById('sestile_'+id)?.classList.add('active');
    aggiornaPrevSerie();
}
function buildSeColorGrid() {
    document.getElementById('seColorGrid').innerHTML = COLORI.map((c,i) =>
        `<div class="color-dot" style="background:${c.s}" title="${c.name}" id="secd_${i}" onclick="seSetColore(${i})"></div>`
    ).join('');
}
function seSetColore(i) {
    const c = COLORI[i];
    stS.sfondo=c.s; stS.testo=c.t; stS.acc=c.a;
    document.getElementById('seCsfondo').value=c.s;
    document.getElementById('seCTesto').value=c.t;
    document.getElementById('seCacc').value=c.a;
    seSincColorGrid(c.s);
    STILI.forEach(s => seAggiornaStilePreview(s.id));
    aggiornaPrevSerie();
}
function seOnCustomColor() {
    stS.sfondo=document.getElementById('seCsfondo').value;
    stS.testo=document.getElementById('seCTesto').value;
    stS.acc=document.getElementById('seCacc').value;
    seSincColorGrid(null);
    STILI.forEach(s => seAggiornaStilePreview(s.id));
    aggiornaPrevSerie();
}
function seSincColorGrid(sfondo) {
    document.querySelectorAll('[id^="secd_"]').forEach((d,i) => {
        d.classList.toggle('active', COLORI[i].s === (sfondo || stS.sfondo));
    });
}
function buildSeFontPicker() {
    document.getElementById('seFontPicker').innerHTML = Object.entries(FONTS).map(([id, f]) =>
        `<button class="font-btn" id="sefont_${id}" onclick="seSetFont('${id}')">
            <div class="font-sample" style="font-family:${f.css}">${f.sample}</div>
            <div class="font-name">${f.label}</div>
        </button>`
    ).join('');
}
function seSetFont(id) {
    stS.font = id;
    document.querySelectorAll('[id^="sefont_"]').forEach(b => b.classList.remove('active'));
    document.getElementById('sefont_'+id)?.classList.add('active');
    aggiornaPrevSerie();
}
function buildSeSizeChips() {
    document.getElementById('seSizeChips').innerHTML = Object.keys(DIM_SCALE).map(id =>
        `<button class="size-chip" id="sesc_${id}" onclick="seSetSizeScale('${id}')">${DIM_LABELS[id]}</button>`
    ).join('');
}
function seSetSizeScale(id) {
    stS.dim_scala = id;
    document.querySelectorAll('#seSizeChips .size-chip').forEach(b => b.classList.remove('active'));
    document.getElementById('sesc_'+id)?.classList.add('active');
    aggiornaPrevSerie();
}
function seToggleGrassetto() {
    stS.grassetto = !stS.grassetto;
    document.getElementById('seTogGrassetto')?.classList.toggle('active', stS.grassetto);
    aggiornaPrevSerie();
}
function seToggleCorsivo() {
    stS.corsivo = !stS.corsivo;
    document.getElementById('seTogCorsivo')?.classList.toggle('active', stS.corsivo);
    aggiornaPrevSerie();
}
function buildSeAlignPicker() {
    const opts = [{ id:'sinistra', label:'Sinistra' }, { id:'centro', label:'Centro' }, { id:'destra', label:'Destra' }];
    document.getElementById('seAlignPicker').innerHTML = opts.map(o =>
        `<button class="align-btn" id="seal_${o.id}" onclick="seSetAllineamento('${o.id}')" title="${o.label}">
            <div style="font-size:11px;font-weight:800;color:inherit">${o.label}</div>
        </button>`
    ).join('');
}
function seSetAllineamento(id) {
    stS.allineamento = id;
    document.querySelectorAll('[id^="seal_"]').forEach(b => b.classList.remove('active'));
    document.getElementById('seal_'+id)?.classList.add('active');
    aggiornaPrevSerie();
}
function buildSeFormatGrid() {
    document.getElementById('seFormatGrid').innerHTML = FORMATI.map(f =>
        `<button class="formato-btn" id="sefmt_${f.id}" onclick="seSetFormato('${f.id}')">
            <div style="display:flex;justify-content:center"><div class="formato-vis" style="width:${f.iw}px;height:${f.ih}px"></div></div>
            <div class="formato-label">${f.label}</div>
            <div class="formato-desc">${f.desc}</div>
        </button>`
    ).join('');
}
function seSetFormato(id) {
    stS.formato = id;
    document.querySelectorAll('[id^="sefmt_"]').forEach(b => b.classList.remove('active'));
    document.getElementById('sefmt_'+id)?.classList.add('active');
    const fmt = FORMATI.find(f => f.id === id);
    if (fmt && fmt.w) {
        document.getElementById('seW').value = fmt.w;
        document.getElementById('seH').value = fmt.h;
    }
    aggiornaPrevSerie();
}
function seOnDimChange() {
    stS.formato = 'custom';
    document.querySelectorAll('[id^="sefmt_"]').forEach(b => b.classList.remove('active'));
    document.getElementById('sefmt_custom')?.classList.add('active');
    aggiornaPrevSerie();
}
function aggiornaPrevSerie() {
    const lines = (document.getElementById('seTitoli')?.value || '').split('\n').map(l => l.trim()).filter(l => l);
    const sub = document.getElementById('seComSub')?.value || '';
    const per = document.getElementById('seComPer')?.value || '';
    const W = parseFloat(document.getElementById('seW')?.value) || 61;
    const H = parseFloat(document.getElementById('seH')?.value) || 67;
    const PX = 3.779;
    const pgWpx = 210 * PX, pgHpx = 297 * PX;
    const marginPx = 10 * PX;
    const contentW = pgWpx - 2*marginPx;
    const contentH = pgHpx - 2*marginPx;
    const Wpx = W * PX, Hpx = H * PX;
    const cols = Math.max(1, Math.floor((contentW + 3*PX) / (Wpx + 3*PX)));
    const rows = Math.max(1, Math.floor((contentH + 3*PX) / (Hpx + 3*PX)));
    const perPage = cols * rows;
    const nPages = lines.length > 0 ? Math.ceil(lines.length / perPage) : 1;
    document.getElementById('sePrevInfo').textContent = lines.length > 0
        ? `${lines.length} etichette — ${nPages} pag${nPages>1?'ine':'ina'} — ${cols}×${rows} per foglio`
        : `Scrivi i titoli sopra — ${cols}×${rows} per foglio (A4)`;
    const pageLines = lines.length > 0 ? lines.slice(0, perPage) : ['Esempio'];
    let labelsHtml = '';
    for (const line of pageLines) {
        const eL = { titolo:line, sottotitolo:sub, periodo:per, icona:stS.icona, stile:stS.stile, colore_sfondo:stS.sfondo, colore_testo:stS.testo, colore_accento:stS.acc, font:stS.font, allineamento:stS.allineamento, grassetto:stS.grassetto, corsivo:stS.corsivo, dim_scala:stS.dim_scala };
        labelsHtml += `<div style="flex-shrink:0;break-inside:avoid">${labelHtml(eL, W, H)}</div>`;
    }
    const pageHtml = `<div style="width:${pgWpx.toFixed(1)}px;height:${pgHpx.toFixed(1)}px;background:#fff;padding:${marginPx.toFixed(1)}px;box-sizing:border-box"><div style="width:${contentW.toFixed(1)}px;height:${contentH.toFixed(1)}px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:3mm;overflow:hidden">${labelsHtml}</div></div>`;
    const targetW = Math.min(288, (window.innerWidth||360) - 64);
    const scale = targetW / pgWpx;
    const scaledH = Math.round(pgHpx * scale);
    const page = document.getElementById('sePrevPage');
    if (!page) return;
    page.innerHTML = pageHtml;
    page.style.transform = `scale(${scale.toFixed(4)})`;
    document.getElementById('sePrevWrap').style.cssText = `width:${targetW}px;height:${scaledH}px;position:relative;overflow:hidden;margin:0 auto 16px;border:1.5px solid var(--grey);border-radius:4px;background:#fff`;
}
function stampaSerie() {
    const lines = (document.getElementById('seTitoli')?.value || '').split('\n').map(l => l.trim()).filter(l => l);
    if (!lines.length) { toast('Inserisci almeno un titolo'); return; }
    const sub = document.getElementById('seComSub')?.value || '';
    const per = document.getElementById('seComPer')?.value || '';
    const W = parseFloat(document.getElementById('seW')?.value) || 61;
    const H = parseFloat(document.getElementById('seH')?.value) || 67;
    let labelsHtml = '';
    for (const line of lines) {
        const eL = { titolo:line, sottotitolo:sub, periodo:per, icona:stS.icona, stile:stS.stile, colore_sfondo:stS.sfondo, colore_testo:stS.testo, colore_accento:stS.acc, font:stS.font, allineamento:stS.allineamento, grassetto:stS.grassetto, corsivo:stS.corsivo, dim_scala:stS.dim_scala };
        labelsHtml += `<div style="flex-shrink:0;break-inside:avoid">${labelHtml(eL, W, H)}</div>`;
    }
    _setPrintStyle(`@media print{@page{size:A4 portrait;margin:10mm;}}`);
    document.getElementById('printLayer').innerHTML = `<div style="display:flex;flex-wrap:wrap;align-content:flex-start;gap:3mm">${labelsHtml}</div>`;
    chiudiSerie();
    requestAnimationFrame(() => window.print());
}

// ── Utils ──────────────────────────────────────────────────────────
let _tt;
function toast(m) { const el=document.getElementById('toast'); el.textContent=m; el.classList.add('show'); clearTimeout(_tt); _tt=setTimeout(()=>el.classList.remove('show'),2800); }
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
</script>

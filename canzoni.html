<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Listando - Canzoni</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/logolistando.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Listando">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            color-scheme: light;
            --green: #0fba8d; --blue: #3384d4; --red: #ff3b30;
            --music: #1db954; --music-dark: #158a3e;
            --grey: #d8dddc; --grey-light: #f2f2f7;
            --dark: #111; --bg: #f5f6f8; --white: #fff;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { overflow-x: hidden; max-width: 100%; margin: 0; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--dark); padding-bottom: 120px; }

        /* ── Header ── */
        .page-header {
            position: sticky; top: 0; z-index: 100;
            background: var(--white); border-bottom: 2px solid var(--grey-light);
            display: flex; align-items: center; gap: 10px;
            padding: 14px 16px; padding-top: max(14px, env(safe-area-inset-top, 14px));
        }
        .btn-back { width: 40px; height: 40px; border-radius: 12px; border: 2.5px solid var(--grey); background: var(--white); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
        .btn-back svg { width: 18px; height: 18px; stroke: var(--dark); fill: none; stroke-width: 2.5; }
        .header-title { font-weight: 900; font-size: 18px; flex: 1; }
        .header-actions { display: flex; gap: 8px; }
        .btn-icon-hdr { width: 40px; height: 40px; border-radius: 12px; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 18px; }
        .btn-icon-hdr.add { background: var(--music); color: white; }
        .btn-icon-hdr.upload { background: var(--blue); color: white; }

        /* ── Playlists ── */
        .section-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 16px 8px; }
        .section-title { font-weight: 900; font-size: 16px; }
        .playlists-scroll { display: flex; gap: 12px; overflow-x: auto; padding: 0 16px 4px; scrollbar-width: none; }
        .playlists-scroll::-webkit-scrollbar { display: none; }
        .playlist-card { flex-shrink: 0; width: 130px; cursor: pointer; }
        .playlist-cover {
            width: 130px; height: 130px; border-radius: 16px;
            background: linear-gradient(135deg, var(--music), #0a8040);
            display: flex; align-items: center; justify-content: center;
            font-size: 40px; margin-bottom: 8px; overflow: hidden; position: relative;
        }
        .playlist-cover img { width: 100%; height: 100%; object-fit: cover; }
        .playlist-cover-count {
            position: absolute; bottom: 6px; right: 8px;
            background: rgba(0,0,0,0.5); color: white;
            font-size: 11px; font-weight: 800; border-radius: 8px; padding: 2px 6px;
        }
        .playlist-name { font-weight: 800; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .playlist-sub { font-size: 11px; color: #888; font-weight: 600; margin-top: 2px; }

        /* ── Song list ── */
        .songs-header { display: flex; align-items: center; gap: 10px; padding: 16px 16px 6px; }
        .songs-title { font-weight: 900; font-size: 16px; flex: 1; }
        .btn-shuffle { padding: 8px 16px; border-radius: 12px; border: none; background: var(--music); color: white; font-weight: 800; font-size: 13px; cursor: pointer; }

        .song-item {
            display: flex; align-items: center; gap: 12px; padding: 10px 16px;
            cursor: pointer; border-bottom: 1px solid var(--grey-light);
            transition: background 0.15s;
        }
        .song-item:active { background: var(--grey-light); }
        .song-item.playing { background: #f0fdf8; }
        .song-num { width: 24px; text-align: center; font-size: 13px; font-weight: 700; color: #bbb; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
        .song-info { flex: 1; min-width: 0; }
        .song-title { font-weight: 800; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .song-title.playing { color: var(--music); }
        .song-artist { font-size: 12px; color: #888; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .song-dur { font-size: 12px; color: #aaa; font-weight: 600; flex-shrink: 0; }
        .btn-song-more { width: 32px; height: 32px; border-radius: 50%; border: none; background: none; font-size: 18px; color: #bbb; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

        /* ── Equalizer animation ── */
        @keyframes eq1 { 0%,100%{height:5px} 50%{height:15px} }
        @keyframes eq2 { 0%,100%{height:12px} 40%{height:5px} }
        @keyframes eq3 { 0%,100%{height:8px} 25%{height:15px} 75%{height:4px} }
        .eq-bars { display: flex; gap: 2px; align-items: flex-end; height: 16px; }
        .eq-bar { width: 3px; border-radius: 2px; background: var(--music); }
        .eq-bar:nth-child(1) { animation: eq1 0.8s ease-in-out infinite; }
        .eq-bar:nth-child(2) { animation: eq2 0.65s ease-in-out infinite; }
        .eq-bar:nth-child(3) { animation: eq3 0.9s ease-in-out infinite; }
        .eq-bars.paused .eq-bar { animation-play-state: paused; height: 5px; }

        /* ── Mini player bar ── */
        .player-bar {
            position: fixed; bottom: 0; left: 0; right: 0; z-index: 200;
            background: #1a1a2e; color: white;
            padding-bottom: max(0px, env(safe-area-inset-bottom, 0px));
            display: none;
        }
        .player-bar.visible { display: block; }
        .player-seek-top { height: 3px; background: rgba(255,255,255,0.15); cursor: pointer; position: relative; }
        .player-seek-fill { height: 100%; background: var(--music); border-radius: 2px; pointer-events: none; }
        .player-mini { display: flex; align-items: center; gap: 10px; padding: 10px 12px; cursor: pointer; }
        .player-art { width: 42px; height: 42px; border-radius: 10px; background: linear-gradient(135deg, var(--music), #0a8040); display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; overflow: hidden; }
        .player-art img { width: 100%; height: 100%; object-fit: cover; }
        .player-info { flex: 1; min-width: 0; pointer-events: none; }
        .player-title { font-weight: 800; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .player-artist { font-size: 12px; color: rgba(255,255,255,0.55); margin-top: 1px; }
        .player-mini-ctrl { display: flex; gap: 2px; align-items: center; }
        .btn-mini { width: 40px; height: 40px; border-radius: 50%; border: none; background: none; color: white; font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .btn-mini.play-pause { width: 44px; height: 44px; background: var(--music); border-radius: 50%; font-size: 20px; }
        .btn-mini:active { opacity: 0.7; }

        /* ── Expanded player ── */
        .player-expanded {
            position: fixed; inset: 0; z-index: 500;
            background: linear-gradient(180deg, #0f3026 0%, #0d1117 60%);
            color: white;
            display: flex; flex-direction: column;
            padding: max(48px, env(safe-area-inset-top, 48px)) 24px max(24px, env(safe-area-inset-bottom, 24px));
            transform: translateY(100%);
            transition: transform 0.38s cubic-bezier(0.32, 0.72, 0, 1);
            overflow: hidden;
        }
        .player-expanded.open { transform: translateY(0); }

        .exp-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
        .exp-close {
            width: 44px; height: 44px; border-radius: 50%; border: none;
            background: rgba(255,255,255,0.12); color: white; font-size: 20px;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .exp-label { font-size: 12px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; color: rgba(255,255,255,0.5); }

        .exp-art-wrap { display: flex; justify-content: center; margin-bottom: 28px; }
        .exp-art {
            width: min(260px, 60vw); height: min(260px, 60vw);
            border-radius: 20px;
            background: linear-gradient(135deg, #1db954, #0a8040);
            display: flex; align-items: center; justify-content: center;
            font-size: min(80px, 18vw); overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .exp-art img { width: 100%; height: 100%; object-fit: cover; }
        .exp-art.playing { animation: artPulse 3s ease-in-out infinite; }
        @keyframes artPulse {
            0%,100% { box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 0 0 rgba(29,185,84,0.25); }
            50%      { box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 0 18px rgba(29,185,84,0); }
        }

        .exp-info { text-align: center; margin-bottom: 20px; min-height: 50px; }
        .exp-title { font-weight: 900; font-size: 22px; margin-bottom: 6px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
        .exp-artist { font-size: 15px; color: rgba(255,255,255,0.55); font-weight: 600; }

        /* Big seek bar */
        .exp-seek-wrap { margin-bottom: 6px; }
        .exp-seek-bg {
            height: 5px; background: rgba(255,255,255,0.2); border-radius: 4px;
            cursor: pointer; position: relative; touch-action: none;
        }
        .exp-seek-bg:active { height: 7px; }
        .exp-seek-fill { height: 100%; background: var(--music); border-radius: 4px; pointer-events: none; position: relative; }
        .exp-seek-thumb {
            position: absolute; right: -8px; top: 50%; transform: translateY(-50%);
            width: 16px; height: 16px; border-radius: 50%; background: white;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
            opacity: 0; transition: opacity 0.15s;
        }
        .exp-seek-bg:active .exp-seek-thumb,
        .exp-seek-bg.dragging .exp-seek-thumb { opacity: 1; }
        .exp-times { display: flex; justify-content: space-between; font-size: 11px; color: rgba(255,255,255,0.4); font-weight: 700; margin-top: 6px; }

        /* Main controls */
        .exp-controls { display: flex; align-items: center; justify-content: space-between; margin: 16px 0; }
        .btn-exp-sec {
            width: 48px; height: 48px; border-radius: 50%; border: none;
            background: none; color: rgba(255,255,255,0.5); font-size: 22px;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: color 0.15s, background 0.15s;
        }
        .btn-exp-sec.active { color: var(--music); }
        .btn-exp-sec:active { background: rgba(255,255,255,0.1); }
        .btn-exp-prev, .btn-exp-next {
            width: 52px; height: 52px; border-radius: 50%; border: none;
            background: rgba(255,255,255,0.08); color: white; font-size: 24px;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .btn-exp-prev:active, .btn-exp-next:active { background: rgba(255,255,255,0.18); }
        .btn-exp-play {
            width: 68px; height: 68px; border-radius: 50%; border: none;
            background: var(--music); color: white; font-size: 28px;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 6px 20px rgba(29,185,84,0.4);
        }
        .btn-exp-play:active { transform: scale(0.95); }

        /* Speed control (expanded) */
        .exp-speed {
            display: flex; align-items: center; justify-content: center; gap: 0;
            background: rgba(255,255,255,0.1); border-radius: 14px;
            padding: 2px; margin-top: 4px;
        }
        .btn-speed-exp {
            width: 44px; height: 36px; border: none; background: none; color: white;
            font-size: 22px; font-weight: 900; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            border-radius: 12px; transition: background 0.1s;
        }
        .btn-speed-exp:active { background: rgba(255,255,255,0.15); }
        .speed-display {
            min-width: 60px; text-align: center;
            font-weight: 900; font-size: 16px; color: white;
            cursor: pointer; user-select: none;
        }
        .speed-display .speed-lbl { font-size: 10px; color: rgba(255,255,255,0.45); font-weight: 700; display: block; margin-top: -2px; letter-spacing: 0.5px; }

        /* ── Upload bar ── */
        .upload-bar { display: none; position: fixed; top: 0; left: 0; right: 0; background: var(--music); color: white; text-align: center; font-size: 13px; font-weight: 800; padding: 10px; z-index: 9999; }

        /* ── Playlist detail ── */
        .back-playlist { display: flex; align-items: center; gap: 8px; padding: 12px 16px; cursor: pointer; }
        .back-playlist span { font-size: 13px; font-weight: 800; color: var(--music); }

        /* ── Empty ── */
        .empty-msg { text-align: center; padding: 48px 24px; color: #bbb; font-weight: 700; font-size: 15px; }

        /* ── Shared songs ── */
        .shared-badge { font-size: 10px; font-weight: 800; background: #e8f4ff; color: #3384d4; border-radius: 6px; padding: 2px 6px; margin-left: 6px; vertical-align: middle; flex-shrink: 0; }
        .song-item.shared-item { background: #f8fbff; }
        .song-item.shared-item .song-title { color: #3384d4; }
        .btn-share-remove { width: 32px; height: 32px; border-radius: 50%; border: none; background: none; font-size: 16px; color: #bbb; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

        /* ── Share modal ── */
        .share-row { display: flex; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--grey-light); }
        .share-row:last-child { border-bottom: none; }
        .share-email { flex: 1; font-size: 14px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .btn-share-del { padding: 5px 10px; border-radius: 8px; border: none; background: #fff0f0; color: var(--red); font-size: 12px; font-weight: 800; cursor: pointer; flex-shrink: 0; }

        /* ── Context menu ── */
        .ctx-menu { display: none; position: fixed; z-index: 999; background: var(--white); border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.18); padding: 8px; min-width: 180px; }
        .ctx-menu.open { display: block; }
        .ctx-item { padding: 12px 16px; font-size: 14px; font-weight: 700; cursor: pointer; border-radius: 10px; }
        .ctx-item:active { background: var(--grey-light); }
        .ctx-item.danger { color: var(--red); }

        /* ── Modals ── */
        .modal-overlay { display: none; position: fixed; inset: 0; z-index: 300; background: rgba(0,0,0,0.5); align-items: flex-end; justify-content: center; }
        .modal-overlay.open { display: flex; }
        .modal-box { background: var(--white); border-radius: 28px 28px 0 0; padding: 24px 20px; padding-bottom: max(24px, env(safe-area-inset-bottom, 24px)); width: 100%; max-width: 500px; max-height: 80vh; overflow-y: auto; }
        .modal-handle { width: 40px; height: 4px; background: var(--grey); border-radius: 4px; margin: 0 auto 20px; }
        .modal-title { font-weight: 900; font-size: 18px; margin-bottom: 18px; }
        .form-group { margin-bottom: 12px; }
        .form-label { font-size: 12px; font-weight: 800; color: #666; margin-bottom: 5px; display: block; text-transform: uppercase; letter-spacing: 0.4px; }
        .form-input { width: 100%; padding: 12px 14px; border-radius: 14px; border: 2.5px solid var(--grey); font-size: 15px; font-family: inherit; outline: none; transition: border-color 0.2s; }
        .form-input:focus { border-color: var(--music); }
        .btn-save-modal { width: 100%; padding: 16px; border-radius: 18px; border: none; background: var(--music); color: white; font-weight: 900; font-size: 16px; cursor: pointer; font-family: inherit; margin-top: 8px; }
        .btn-delete-modal { width: 100%; padding: 14px; border-radius: 18px; border: none; background: #fff0f0; color: var(--red); font-weight: 800; font-size: 14px; cursor: pointer; font-family: inherit; margin-top: 8px; }

        .toast { position: fixed; bottom: 120px; left: 50%; transform: translateX(-50%) translateY(20px); background: rgba(0,0,0,0.85); color: white; padding: 12px 20px; border-radius: 14px; font-weight: 700; font-size: 14px; opacity: 0; transition: all 0.25s; white-space: nowrap; z-index: 9999; pointer-events: none; }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        input[type="file"] { display: none; }
    </style>
</head>
<body>

<div class="upload-bar" id="uploadBar">⬆️ Carico…</div>

<div class="page-header">
    <button class="btn-back" onclick="goBack()">
        <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div class="header-title" id="headerTitle">CANZONI</div>
    <div class="header-actions">
        <button class="btn-icon-hdr upload" id="btnUpload" onclick="document.getElementById('fileInput').click()" title="Carica MP3">⬆️</button>
        <button class="btn-icon-hdr add" onclick="apriNuovaPlaylist()" title="Nuova raccolta">+</button>
    </div>
</div>

<input type="file" id="fileInput" accept="audio/mpeg,audio/mp3,audio/aac,audio/ogg,audio/wav,audio/*" multiple onchange="handleFiles(this.files)">

<!-- Main view -->
<div id="mainView">
    <div class="section-header">
        <div class="section-title">🎵 Le tue raccolte</div>
    </div>
    <div class="playlists-scroll" id="playlistsScroll"></div>

    <!-- Canzoni condivise con me -->
    <div id="sharedSection" style="display:none">
        <div class="songs-header">
            <div class="songs-title">🔗 Condivise con te</div>
        </div>
        <div id="sharedSongsList"></div>
    </div>

    <div class="songs-header">
        <div class="songs-title">Tutte le canzoni</div>
        <button class="btn-shuffle" onclick="shuffle()">🔀 Shuffle</button>
    </div>
    <div id="allSongsList"></div>
</div>

<!-- Playlist detail view -->
<div id="playlistView" style="display:none">
    <div class="back-playlist" onclick="tornaAlMain()">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
        <span>Raccolte</span>
    </div>
    <div style="padding: 0 16px 12px; display:flex; align-items:center; gap:14px">
        <div class="playlist-cover" style="width:80px;height:80px;border-radius:12px;font-size:28px;flex-shrink:0" id="plDetailCover">🎵</div>
        <div style="flex:1;min-width:0">
            <div id="plDetailName" style="font-weight:900;font-size:20px"></div>
            <div id="plDetailCount" style="font-size:13px;color:#888;font-weight:600;margin-top:4px"></div>
        </div>
        <button onclick="modificaPlaylistCorrente()" style="flex-shrink:0;padding:8px 14px;border-radius:12px;border:2px solid var(--grey);background:none;font-size:13px;font-weight:800;cursor:pointer;color:var(--dark);font-family:inherit">✏️ Modifica</button>
    </div>
    <div id="playlistSongsList"></div>
</div>

<!-- Context menu -->
<div class="ctx-menu" id="ctxMenu">
    <div class="ctx-item" id="ctxRinomina" onclick="ctxAction('rinomina')">✏️ Modifica</div>
    <div class="ctx-item" id="ctxCondividi" onclick="ctxAction('condividi')">🔗 Condividi</div>
    <div class="ctx-item" id="ctxSposta" style="display:none" onclick="ctxAction('sposta')">📁 Sposta raccolta</div>
    <div class="ctx-item danger" id="ctxElimina" onclick="ctxAction('elimina')">🗑️ Elimina</div>
</div>

<!-- Playlist modal -->
<div class="modal-overlay" id="modalePlaylist">
    <div class="modal-box">
        <div class="modal-handle"></div>
        <div class="modal-title" id="plModalTitle">Nuova raccolta</div>
        <div class="form-group">
            <label class="form-label">Nome raccolta *</label>
            <input class="form-input" id="plNome" placeholder="es. Estate 2024, Pop, Relax…" type="text">
        </div>
        <button class="btn-save-modal" onclick="salvaPlaylist()">SALVA</button>
        <button class="btn-delete-modal" id="btnElPlaylist" style="display:none" onclick="eliminaPlaylist()">ELIMINA RACCOLTA</button>
    </div>
</div>

<!-- Share modal -->
<div class="modal-overlay" id="modaleCondividi">
    <div class="modal-box">
        <div class="modal-handle"></div>
        <div class="modal-title">🔗 Condividi</div>
        <div style="font-size:14px;font-weight:800;color:#555;margin-bottom:16px" id="condividiSongName"></div>
        <div class="form-group">
            <label class="form-label">Email utente</label>
            <input class="form-input" id="condividiEmailInput" type="email" placeholder="utente@email.com"
                   onkeydown="if(event.key==='Enter') aggiungiCondivisione()">
        </div>
        <button class="btn-save-modal" onclick="aggiungiCondivisione()">CONDIVIDI</button>
        <div id="condividiListaWrap" style="margin-top:18px;display:none">
            <div class="form-label" style="margin-bottom:8px">Già condivisa con</div>
            <div id="condividiLista"></div>
        </div>
    </div>
</div>

<!-- Song edit modal -->
<div class="modal-overlay" id="modaleSong">
    <div class="modal-box">
        <div class="modal-handle"></div>
        <div class="modal-title">Modifica canzone</div>
        <div class="form-group">
            <label class="form-label">Titolo *</label>
            <input class="form-input" id="sTitolo" type="text">
        </div>
        <div class="form-group">
            <label class="form-label">Artista</label>
            <input class="form-input" id="sArtista" type="text" placeholder="Artista / Band">
        </div>
        <div class="form-group">
            <label class="form-label">Raccolta</label>
            <select class="form-input" id="sPlaylist">
                <option value="">— Nessuna —</option>
            </select>
        </div>
        <button class="btn-save-modal" onclick="salvaSong()">SALVA</button>
        <button class="btn-delete-modal" onclick="eliminaSong()">ELIMINA</button>
    </div>
</div>

<!-- Mini player bar -->
<div class="player-bar" id="playerBar">
    <div class="player-seek-top" id="miniSeekBg" onclick="miniSeekClick(event)">
        <div class="player-seek-fill" id="miniSeekFill" style="width:0%"></div>
    </div>
    <div class="player-mini" onclick="openExpanded()">
        <div class="player-art" id="playerArt">🎵</div>

// ── Player core ────────────────────────────────────────────────────────
function playSong(id, list) {
    const songList = list || (currentPlaylistId ? songs.filter(s => s.playlist_id === currentPlaylistId) : songs);
    const idx = songList.findIndex(s => s.id === id);
    if (idx === -1) return;
    origQueue = songList;
    queue = isShuffleOn ? shuffledFrom(songList, idx) : [...songList];
    queueIdx = isShuffleOn ? 0 : idx;
    loadAndPlay();
}

function loadAndPlay() {
    const s = queue[queueIdx];
    if (!s) return;
    audio.src = s.url;
    audio.playbackRate = currentSpeed;
    audio.play().catch(e => console.warn('play:', e));
    // Re-apply speed after browser parses the stream (some browsers reset it)
    audio.addEventListener('canplay', () => { audio.playbackRate = currentSpeed; }, { once: true });
    updateNowPlaying(s);
    updateMediaSession(s);
}

function updateNowPlaying(s) {
    const title = s.titolo, artist = s.artista || '';
    document.getElementById('playerTitle').textContent = title;
    document.getElementById('playerArtist').textContent = artist;
    document.getElementById('expTitle').textContent = title;
    document.getElementById('expArtist').textContent = artist;
    document.getElementById('expArt').classList.add('playing');
    document.getElementById('playerBar').classList.add('visible');
    updatePlayBtn(false);
    renderSongLists();
}

function renderSongLists() {
    renderMain();
    if (currentPlaylistId) renderSongList('playlistSongsList', songs.filter(s => s.playlist_id === currentPlaylistId));
}

function updatePlayBtn(paused) {
    const playIcon = `<svg width="20" height="20" fill="white" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`;
    const pauseIcon = `<svg width="20" height="20" fill="white" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>`;
    const expPlaySvg = paused
        ? `<svg width="28" height="28" fill="white" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`
        : `<svg width="28" height="28" fill="white" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>`;
    document.getElementById('btnPlayPause').innerHTML = paused ? playIcon : pauseIcon;
    document.getElementById('expBtnPlay').innerHTML = expPlaySvg;
    const art = document.getElementById('expArt');
    paused ? art.classList.remove('playing') : art.classList.add('playing');
}

function togglePlay() {
    if (!audio.src) return;
    if (audio.paused) { audio.play(); updatePlayBtn(false); }
    else { audio.pause(); updatePlayBtn(true); renderSongLists(); }
}

audio.addEventListener('ended', () => {
    if (repeatMode === 2) {
        audio.currentTime = 0;
        audio.play();
    } else if (repeatMode === 1 || queueIdx < queue.length - 1) {
        nextSong();
    } else {
        // Last song, no repeat: stay on song, show replay
        audio.currentTime = 0;
        updatePlayBtn(true);
        renderSongLists();
        toast('Fine coda — premi ▶ per ripartire');
    }
});

audio.addEventListener('pause', () => { renderSongLists(); });
audio.addEventListener('play',  () => { renderSongLists(); });

function nextSong() {
    if (repeatMode === 2) { audio.currentTime = 0; audio.play(); return; }
    queueIdx = (queueIdx + 1) % queue.length;
    loadAndPlay();
}

function prevSong() {
    if (audio.currentTime > 3) { audio.currentTime = 0; return; }
    if (repeatMode === 2) { audio.currentTime = 0; audio.play(); return; }
    queueIdx = (queueIdx - 1 + queue.length) % queue.length;
    loadAndPlay();
}

// ── Shuffle ────────────────────────────────────────────────────────────
function toggleShuffle() {
    isShuffleOn = !isShuffleOn;
    document.getElementById('btnShuffle').classList.toggle('active', isShuffleOn);
    if (queue.length) {
        const cur = queue[queueIdx];
        if (isShuffleOn) {
            queue = shuffledFrom(origQueue, origQueue.findIndex(s => s.id === cur.id));
            queueIdx = 0;
        } else {
            queue = [...origQueue];
            queueIdx = queue.findIndex(s => s.id === cur.id);
        }
    }
    toast(isShuffleOn ? '🔀 Shuffle ON' : 'Shuffle OFF');
}

function shuffledFrom(list, startIdx) {
    const cur = list[startIdx];
    const rest = list.filter((_, i) => i !== startIdx).sort(() => Math.random() - 0.5);
    return [cur, ...rest];
}

function shuffle() {
    const list = currentPlaylistId ? songs.filter(s => s.playlist_id === currentPlaylistId) : songs;
    if (!list.length) { toast('Nessuna canzone'); return; }
    origQueue = list;
    queue = [...list].sort(() => Math.random() - 0.5);
    queueIdx = 0;
    isShuffleOn = true;
    document.getElementById('btnShuffle').classList.add('active');
    loadAndPlay();
    toast('🔀 Shuffle attivo');
}

const repeatIcons = [

// ── Speed ──────────────────────────────────────────────────────────────
function changeSpeed(dir) {
    currentSpeed = Math.round((currentSpeed + dir * 0.1) * 10) / 10;
    currentSpeed = Math.max(0.5, Math.min(2.0, currentSpeed));
    applySpeed();
}

function resetSpeed() {
    if (currentSpeed === 1.0) return;
    currentSpeed = 1.0;
    applySpeed();
    toast('Velocità ripristinata 1×');
}

function applySpeed() {
    audio.playbackRate = currentSpeed;
    const label = currentSpeed.toFixed(1) + '×';
    document.getElementById('speedVal').textContent = label;
    const disp = document.getElementById('speedDisplay');
    disp.style.color = currentSpeed !== 1.0 ? '#1db954' : 'white';
}

// ── Progress & seek ────────────────────────────────────────────────────
audio.addEventListener('timeupdate', () => {
    if (!audio.duration) return;
    const pct = (audio.currentTime / audio.duration) * 100;
    document.getElementById('miniSeekFill').style.width = pct + '%';
    document.getElementById('expSeekFill').style.width = pct + '%';
    document.getElementById('expTimeCur').textContent = fmtTime(audio.currentTime);
    document.getElementById('expTimeTot').textContent = fmtTime(audio.duration);
});

function miniSeekClick(e) {
    if (!audio.duration) return;
    const rect = e.currentTarget.getBoundingClientRect();
    audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
}

function initExpSeek() {
    const bg = document.getElementById('expSeekBg');
    let dragging = false;
    function seek(e) {
        if (!audio.duration) return;
        const t = e.touches ? e.touches[0] : e;
        const rect = bg.getBoundingClientRect();
        const pct = Math.max(0, Math.min(1, (t.clientX - rect.left) / rect.width));
        audio.currentTime = pct * audio.duration;
    }
    bg.addEventListener('mousedown',  e => { dragging = true; bg.classList.add('dragging'); seek(e); });
    bg.addEventListener('touchstart', e => { dragging = true; bg.classList.add('dragging'); seek(e); e.preventDefault(); }, { passive: false });
    document.addEventListener('mousemove',  e => { if (dragging) seek(e); });
    document.addEventListener('touchmove',  e => { if (dragging) { seek(e); e.preventDefault(); } }, { passive: false });
    document.addEventListener('mouseup',  () => { dragging = false; bg.classList.remove('dragging'); });
    document.addEventListener('touchend', () => { dragging = false; bg.classList.remove('dragging'); });
}

// ── Media Session API ──────────────────────────────────────────────────
function updateMediaSession(s) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
        title: s.titolo,
        artist: s.artista || 'Listando',
        album: playlists.find(p => p.id === s.playlist_id)?.nome || ''
    });
    navigator.mediaSession.setActionHandler('play',          () => { audio.play();  updatePlayBtn(false); });
    navigator.mediaSession.setActionHandler('pause',         () => { audio.pause(); updatePlayBtn(true); });
    navigator.mediaSession.setActionHandler('previoustrack', prevSong);
    navigator.mediaSession.setActionHandler('nexttrack',     nextSong);
    navigator.mediaSession.setActionHandler('seekto', d => { if (d.seekTime != null) audio.currentTime = d.seekTime; });
}

// ── Upload ─────────────────────────────────────────────────────────────
async function handleFiles(fileList) {
    const files = Array.from(fileList).filter(f => f.type.startsWith('audio/') || f.name.match(/\.(mp3|aac|ogg|wav|flac|m4a)$/i));
    if (!files.length) { toast('Nessun file audio selezionato'); return; }
    const bar = document.getElementById('uploadBar');
    bar.style.display = 'block';
    let ok = 0;
    for (let i = 0; i < files.length; i++) {
        const file = files[i];
        bar.textContent = `⬆️ Carico ${i + 1} di ${files.length}: ${file.name}`;
        try {
            const slug = userEmail.replace(/[^a-zA-Z0-9]/g, '_');
            const ext = file.name.split('.').pop().toLowerCase();
            const fname = `${Date.now()}_${Math.random().toString(36).slice(2)}.${ext}`;
            const path = `${slug}/audio/${fname}`;
            const { error: upErr } = await sb.storage.from('canzoni').upload(path, file, { contentType: file.type || 'audio/mpeg' });
            if (upErr) throw upErr;
            const { data: { publicUrl } } = sb.storage.from('canzoni').getPublicUrl(path);
            let durata_sec = null;
            try { durata_sec = await getAudioDuration(file); } catch {}
            const baseName = file.name.replace(/\.[^.]+$/, '');
            const [artista, titolo] = baseName.includes(' - ')
                ? baseName.split(' - ', 2).map(s => s.trim())
                : [null, baseName];
            const { error: dbErr } = await sb.from('canzoni').insert({
                email_utente: userEmail,
                playlist_id: currentPlaylistId || null,
                titolo: titolo || baseName,
                artista: artista || null,
                storage_path: path,
                url: publicUrl,
                size_bytes: file.size,
                durata_sec,
                sort_order: Date.now() + i
            });
            if (dbErr) throw dbErr;
            ok++;
        } catch(e) {
            console.error(e);
            toast('Errore: ' + (e.message || 'riprova'));
        }
    }
    bar.style.display = 'none';
    document.getElementById('fileInput').value = '';
    await carica();
    if (currentPlaylistId) apriPlaylist(currentPlaylistId);
    if (ok > 0) toast(`✓ ${ok} ${ok === 1 ? 'canzone caricata' : 'canzoni caricate'}!`);
}

function getAudioDuration(file) {
    return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const a = document.createElement('audio');
        a.src = url;
        a.onloadedmetadata = () => { URL.revokeObjectURL(url); resolve(a.duration); };
        a.onerror = reject;
    });
}

    if (editPlaylistId) {
        await sb.from('canzoni_playlist').update({ nome }).eq('id', editPlaylistId);
        toast('✓ Raccolta rinominata');
    } else {
        const { error } = await sb.from('canzoni_playlist').insert({ email_utente: userEmail, nome });
        if (error) { toast('Errore: ' + error.message); return; }
        toast('✓ Raccolta creata');
    }
    document.getElementById('modalePlaylist').classList.remove('open');
    await carica();
}

async function eliminaPlaylist() {
    if (!editPlaylistId || !confirm('Eliminare la raccolta? Le canzoni rimarranno.')) return;
    await sb.from('canzoni_playlist').delete().eq('id', editPlaylistId);
    document.getElementById('modalePlaylist').classList.remove('open');
    tornaAlMain();
    toast('Raccolta eliminata');
    await carica();
}

// ── Context menu ────────────────────────────────────────────────────────
function apriCtxSong(id, e, isShared) {
    ctxTargetId = id;
    ctxIsShared = !!isShared;
    // Own songs: show all options. Shared songs: nothing useful to show.
    document.getElementById('ctxRinomina').style.display = isShared ? 'none' : '';
    document.getElementById('ctxCondividi').style.display = isShared ? 'none' : '';
    document.getElementById('ctxElimina').style.display  = isShared ? 'none' : '';
    showCtx(e.clientX, e.clientY);
}
function showCtx(x, y) {
    const m = document.getElementById('ctxMenu');
    m.classList.add('open');
    m.style.left = Math.min(x, window.innerWidth - 200) + 'px';
    m.style.top = Math.min(y, window.innerHeight - 150) + 'px';
}
document.addEventListener('click', e => {
    if (!document.getElementById('ctxMenu').contains(e.target)) document.getElementById('ctxMenu').classList.remove('open');
});

async function ctxAction(action) {
    document.getElementById('ctxMenu').classList.remove('open');
    if (action === 'condividi') { apriCondividi(ctxTargetId); return; }
    const s = songs.find(x => x.id === ctxTargetId);
    if (!s) return;
    if (action === 'rinomina') apriEditSong(s);
    else if (action === 'elimina') await eliminaSongById(ctxTargetId);
}

function apriEditSong(s) {
    editSongId = s.id;
    document.getElementById('sTitolo').value = s.titolo || '';
    document.getElementById('sArtista').value = s.artista || '';
    const sel = document.getElementById('sPlaylist');
    sel.innerHTML = '<option value="">— Nessuna raccolta —</option>' +
        playlists.map(p => `<option value="${p.id}"${p.id === s.playlist_id ? ' selected' : ''}>${p.nome}</option>`).join('');
    document.getElementById('modaleSong').classList.add('open');
}

async function salvaSong() {
    const s = songs.find(x => x.id === editSongId);
    if (!s) return;
    const titolo = document.getElementById('sTitolo').value.trim();
    if (!titolo) { toast('Inserisci il titolo'); return; }
    const plVal = document.getElementById('sPlaylist').value;
    const { error } = await sb.from('canzoni').update({
        titolo,
        artista: document.getElementById('sArtista').value.trim() || null,
        playlist_id: plVal ? Number(plVal) : null
    }).eq('id', editSongId);
    if (error) { toast('Errore: ' + error.message); return; }
    document.getElementById('modaleSong').classList.remove('open');
    toast('✓ Salvato');
    await carica();
    if (currentPlaylistId) apriPlaylist(currentPlaylistId);
}

async function eliminaSong() {
    if (!editSongId || !confirm('Eliminare questa canzone?')) return;
    document.getElementById('modaleSong').classList.remove('open');
    await eliminaSongById(editSongId);
}

// ── Condivisione ────────────────────────────────────────────────────────
async function apriCondividi(songId) {
    condividiTargetId = songId;
    const s = songs.find(x => x.id === songId);
    document.getElementById('condividiSongName').textContent = s?.titolo || '';
    document.getElementById('condividiEmailInput').value = '';
    await refreshCondividiLista();
    document.getElementById('modaleCondividi').classList.add('open');
}

async function refreshCondividiLista() {
    const { data: shares } = await sb.from('canzoni_condivisioni')
        .select('*').eq('canzone_id', condividiTargetId).eq('email_mittente', userEmail);
    const wrap = document.getElementById('condividiListaWrap');
    const lista = document.getElementById('condividiLista');
    if (!shares?.length) { wrap.style.display = 'none'; return; }
    wrap.style.display = '';
    lista.innerHTML = shares.map(sh =>
        `<div class="share-row">
            <span class="share-email">${sh.email_destinatario}</span>
            <button class="btn-share-del" onclick="eliminaCondivisione(${sh.id})">Rimuovi</button>
        </div>`
    ).join('');
}

async function aggiungiCondivisione() {
    const email = document.getElementById('condividiEmailInput').value.trim().toLowerCase();
    if (!email.includes('@')) { toast('Email non valida'); return; }
    if (email === userEmail) { toast('Non puoi condividere con te stesso'); return; }
    const { error } = await sb.from('canzoni_condivisioni').insert({
        canzone_id: condividiTargetId,
        email_mittente: userEmail,
        email_destinatario: email
    });
    if (error) {
        toast(error.code === '23505' ? 'Già condivisa con questo utente' : 'Errore: ' + error.message);
        return;
    }
    document.getElementById('condividiEmailInput').value = '';
    toast('✓ Condivisa con ' + email);
    await refreshCondividiLista();
}

async function eliminaCondivisione(shareId) {
    await sb.from('canzoni_condivisioni').delete().eq('id', shareId);
    toast('Condivisione rimossa');
    await refreshCondividiLista();
    await carica();
}

async function rimuoviSharedSong(condDivId) {
    if (!confirm('Rimuovere questa canzone dalle condivise con te?')) return;
    await sb.from('canzoni_condivisioni').delete().eq('id', condDivId);
    toast('Rimossa dalle condivise');
    await carica();
}

function playFromShared(id) {
    const idx = sharedSongs.findIndex(x => x.id === id);
    if (idx === -1) return;
    origQueue = sharedSongs;
    queue = [...sharedSongs];
    queueIdx = idx;
    loadAndPlay();
}

async function eliminaSongById(id) {
    const s = songs.find(x => x.id === id);
    if (!s) return;
    if (queue[queueIdx]?.id === id) {
        audio.pause(); audio.src = '';
        document.getElementById('playerBar').classList.remove('visible');
        closeExpanded();
    }
    await sb.storage.from('canzoni').remove([s.storage_path]);
    await sb.from('canzoni').delete().eq('id', id);
    toast('Canzone eliminata');
    await carica();
    if (currentPlaylistId) apriPlaylist(currentPlaylistId);
}

[document.getElementById('modalePlaylist'), document.getElementById('modaleSong'), document.getElementById('modaleCondividi')].forEach(m => {
    m.addEventListener('click', e => { if (e.target === m) m.classList.remove('open'); });
});

// ── Utilities ──────────────────────────────────────────────────────────
function fmtTime(sec) {
    if (!isFinite(sec)) return '0:00';
    const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
    return `${m}:${s.toString().padStart(2,'0')}`;
}

let toastTimer;
function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}

// ── Init ───────────────────────────────────────────────────────────────
initExpSeek();

carica().then(() => {
    const savedPid = parseInt(sessionStorage.getItem('can_pid'));
    if (savedPid && playlists.find(p => p.id === savedPid)) apriPlaylist(savedPid);
});
</script>
</body>
</html>
